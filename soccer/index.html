<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b2d17">
<title>فوتبال دیسکی</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:#0b2d17;color:#fff;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;font-family:Tahoma,system-ui,sans-serif}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hidden{display:none!important}
button{font:inherit;color:#fff;cursor:pointer}
.btn{display:block;width:100%;padding:14px 16px;border:0;border-radius:14px;font-size:16px;font-weight:700;color:#10260f;
  background:linear-gradient(#ffe57a,#f0b81c);box-shadow:0 4px 0 #8a5d00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5d00}
.btn.alt{background:linear-gradient(#41cf6a,#1f9b43);color:#fff;box-shadow:0 4px 0 #11602a}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.25)}
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;
  background:radial-gradient(circle at 50% 30%,#14542b,#06170d);overflow:auto}
.screen h1{margin:0;font-size:30px;color:#ffe57a;text-shadow:0 3px 0 #7a3b00}
.screen h2{margin:0;font-size:20px}
.screen p{margin:0;color:#b9d8c3;font-size:14px;text-align:center;line-height:1.8}
.col{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:8px}
.chip{flex:1;padding:10px 4px;border-radius:10px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);font-size:14px}
.chip.on{background:#ffe57a;color:#10260f;border-color:#ffe57a;font-weight:700}
.lbl{font-size:13px;color:#b9d8c3;margin-bottom:-4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:520px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr);max-width:700px}}
.card{background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:8px;text-align:center;font-size:14px}
.card:active{border-color:#ffe57a;background:rgba(255,229,122,.15)}
.card canvas{width:100%;max-width:140px;height:auto;display:block;margin:0 auto 6px;border-radius:8px}
.card small{display:block;color:#9fc4ab;font-size:11px}
a.back{color:#9fc4ab;font-size:13px;text-decoration:none}

#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 8px 4px;pointer-events:none}
#hud button{pointer-events:auto;width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);font-size:17px}
.sb{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:5px 10px;min-width:0}
.tm{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.tm b{font-size:24px;min-width:22px;text-align:center}
.tm .dot{width:12px;height:12px;border-radius:50%}
.t0 .dot{background:#2f6df0;box-shadow:0 0 8px #4fd3ff}.t1 .dot{background:#e0434d;box-shadow:0 0 8px #ff8a65}
.tm.act{color:#ffe57a;font-weight:700}
.mid{display:flex;flex-direction:column;align-items:center;gap:3px;width:104px;font-size:11px;color:#cfe8d6}
#bar{width:100%;height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:100%;background:#41cf6a;transform-origin:left}
.banner{position:fixed;z-index:15;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
  background:rgba(0,0,0,.72);border:2px solid #ffe57a;border-radius:18px;padding:16px 28px;min-width:220px}
.banner.end{pointer-events:auto;z-index:25;display:flex;flex-direction:column;gap:10px}
.banner h2{margin:0;font-size:34px;color:#ffe57a;text-shadow:0 3px 0 #7a3b00}
.banner p{margin:4px 0 0;font-size:15px}
.banner.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}

/* ===== animations ===== */
@keyframes scr{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-34px) scale(.8)}to{opacity:1;transform:none}}
@keyframes slideup{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes glow{50%{text-shadow:0 3px 0 #7a3b00,0 0 24px rgba(255,229,122,.8)}}
@keyframes shine{0%,55%{left:-60%}100%{left:140%}}
@keyframes rise{to{transform:translateY(-120vh) rotate(360deg)}}
@keyframes cardin{from{opacity:0;transform:translateY(28px) scale(.8)}to{opacity:1;transform:none}}
@keyframes chosen{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.9);color:#ffe57a}100%{transform:scale(1)}}
@keyframes dotp{50%{transform:scale(1.55)}}
@keyframes swap{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes hudin{from{transform:translateY(-110%)}to{transform:none}}
@keyframes wob{to{transform:scale(1.07) rotate(-1.5deg)}}
.screen:not(.hidden){animation:scr .35s ease-out}
.screen>*:not(.floaters){position:relative;z-index:1}
.screen h1,.screen h2{animation:drop .7s cubic-bezier(.2,1.5,.4,1) backwards}
.screen h1{animation:drop .7s cubic-bezier(.2,1.5,.4,1) backwards,glow 3s ease-in-out .8s infinite}
.screen>p{animation:slideup .6s .15s backwards}
.col>*{animation:slideup .55s cubic-bezier(.2,1,.3,1) backwards}
.col>*:nth-child(1){animation-delay:.10s}.col>*:nth-child(2){animation-delay:.18s}.col>*:nth-child(3){animation-delay:.26s}
.col>*:nth-child(4){animation-delay:.34s}.col>*:nth-child(5){animation-delay:.42s}
.floaters{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.floaters i{position:absolute;bottom:-90px;width:var(--s);height:var(--s);border-radius:50%;opacity:.17;animation:rise linear infinite}
.floaters .bu{background:#2a64e0;border:4px solid #e8edf5}.floaters .rd{background:#e0434d;border:4px solid #f6dc86}.floaters .bl{background:#fff}
.btn{position:relative;overflow:hidden;transition:transform .12s,box-shadow .12s,filter .2s}
.btn:hover{filter:brightness(1.08)}
.btn::after{content:'';position:absolute;top:0;left:-60%;width:35%;height:100%;transform:skewX(-20deg);
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.4s infinite;pointer-events:none}
.btn.ghost::after{display:none}
.chip{transition:background .2s,color .2s,border-color .2s,transform .15s}.chip:active{transform:scale(.93)}
.chip.on{animation:chosen .3s}
.card{transition:transform .18s,border-color .2s,background .2s;animation:cardin .5s cubic-bezier(.2,1.4,.4,1) backwards}
.card:hover{transform:translateY(-5px) scale(1.03);border-color:#ffe57a}
.card.chosen{animation:chosen .3s;border-color:#ffe57a;background:rgba(255,229,122,.28)}
.card canvas{transition:transform .25s}.card:hover canvas{transform:scale(1.06) rotate(-1deg)}
#hud:not(.hidden){animation:hudin .55s cubic-bezier(.2,1.2,.4,1)}
.tm b.bump{animation:bump .65s cubic-bezier(.2,1.8,.4,1)}
.tm.act .dot{animation:dotp 1s ease-in-out infinite}
.tm{transition:color .3s}
#turnLbl.swap{animation:swap .35s}
#bar i{transition:transform .2s linear,background .3s}
#hud button{transition:transform .12s,background .2s}#hud button:active{transform:scale(.88);background:rgba(255,229,122,.35)}
.banner h2{animation:wob 1.1s ease-in-out infinite alternate}
.banner.end .btn{animation:slideup .5s backwards}.banner.end .btn:nth-of-type(1){animation-delay:.25s}.banner.end .btn:nth-of-type(2){animation-delay:.35s}.banner.end .btn:nth-of-type(3){animation-delay:.45s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (max-width:420px){#hud{gap:5px;padding-left:5px;padding-right:5px}#hud button{width:36px;height:36px}.sb{gap:4px;padding:4px 6px}.mid{width:76px;font-size:10px}.tm{font-size:11px;gap:4px}.tm b{font-size:20px;min-width:16px}.tm .dot{display:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden" dir="ltr">
  <button id="bMenu" aria-label="منو">☰</button>
  <div class="sb">
    <div class="tm t0" id="tm0"><span class="dot"></span><span id="n0">آبی</span><b id="s0">0</b></div>
    <div class="mid"><span id="turnLbl"></span><div id="bar"><i></i></div></div>
    <div class="tm t1" id="tm1"><b id="s1">0</b><span id="n1">قرمز</span><span class="dot"></span></div>
  </div>
  <button id="bSnd" aria-label="صدا">🔊</button>
</div>

<div id="menu" class="screen">
  <h1>⚽ فوتبال دیسکی</h1>
  <p>دیسک‌ها را بکش و رها کن تا توپ را به دروازه حریف بزنی.<br>اولین تیمی که به ۳ گل برسد برنده است.</p>
  <div class="col">
    <div class="lbl">سطح کامپیوتر</div>
    <div class="chips" id="diff">
      <button class="chip" data-d="easy">آسان</button>
      <button class="chip on" data-d="normal">متوسط</button>
      <button class="chip" data-d="hard">سخت</button>
    </div>
    <button class="btn" id="bAI">بازی با کامپیوتر</button>
    <button class="btn alt" id="b2P">دو نفره (روی یک دستگاه)</button>
    <a class="back" href="../" style="text-align:center">← بازگشت به منوی بازی‌ها</a>
  </div>
</div>

<div id="fsel" class="screen hidden">
  <h2 id="fTitle">ترکیب تیم را انتخاب کن</h2>
  <div class="grid" id="fgrid"></div>
  <button class="btn ghost" id="fBack" style="max-width:240px">بازگشت</button>
</div>

<div id="pause" class="screen hidden" style="background:rgba(4,14,8,.86)">
  <h2>توقف</h2>
  <div class="col">
    <button class="btn alt" id="pResume">ادامه بازی</button>
    <button class="btn" id="pRestart">شروع دوباره (همین ترکیب‌ها)</button>
    <button class="btn ghost" id="pMenu">منوی اصلی</button>
  </div>
</div>

<div id="banner" class="banner hidden"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/*PHYSICS_START*/
const WW = 1000, WH = 600, FL = 70, FR = 930, FT = 55, FB = 545, CX = 500, CY = 300, GW = 190, GD = 44;
const R_DISC = 27, R_BALL = 13;
const mT = CY - GW / 2, mB = CY + GW / 2;
const SEGS = [
  [FL,FT,FR,FT],[FL,FB,FR,FB],
  [FL,FT,FL,mT],[FL,mB,FL,FB],[FR,FT,FR,mT],[FR,mB,FR,FB],
  [FL,mT,FL-GD,mT],[FL,mB,FL-GD,mB],[FL-GD,mT,FL-GD,mB],
  [FR,mT,FR+GD,mT],[FR,mB,FR+GD,mB],[FR+GD,mT,FR+GD,mB]
];
const E_DISC = .86, E_BALL = .92, E_WALL = .78, E_WALL_BALL = .88;
const DT = 1 / 120;
let LOG = false; const HITS = [];

function mk(x, y, team) {
  const ball = team < 0;
  return { x, y, vx: 0, vy: 0, r: ball ? R_BALL : R_DISC, m: ball ? 1 : 4, k: ball ? 1.6 : 2.7,
           stop: ball ? 10 : 14, max: ball ? 2200 : 1900, team, ball, rot: 0 };
}
const cloneB = B => B.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, r: b.r, m: b.m, k: b.k, stop: b.stop, max: b.max, team: b.team, ball: b.ball, rot: b.rot }));
const moving = B => { for (const b of B) if (b.vx || b.vy) return true; return false; };

function segHit(b, s) {
  const x1 = s[0], y1 = s[1], ex = s[2] - x1, ey = s[3] - y1;
  let t = ((b.x - x1) * ex + (b.y - y1) * ey) / (ex * ex + ey * ey);
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const px = x1 + ex * t, py = y1 + ey * t;
  let dx = b.x - px, dy = b.y - py;
  const d2 = dx * dx + dy * dy;
  if (d2 >= b.r * b.r) return;
  let d = Math.sqrt(d2), nx, ny;
  if (d < 1e-6) { nx = CX - b.x; ny = CY - b.y; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l; d = 0; }
  else { nx = dx / d; ny = dy / d; }
  b.x = px + nx * b.r; b.y = py + ny * b.r;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) {
    const e = b.ball ? E_WALL_BALL : E_WALL;
    b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
    if (LOG && vn < -80) HITS.push([1, -vn, b.x, b.y]);
  }
}
function sub(B, h) {
  for (const b of B) {
    b.x += b.vx * h; b.y += b.vy * h;
    const f = Math.exp(-b.k * h); b.vx *= f; b.vy *= f;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp < b.stop) { b.vx = 0; b.vy = 0; }
    else { if (sp > b.max) { const c = b.max / sp; b.vx *= c; b.vy *= c; } if (b.ball) b.rot += sp * h / b.r; }
  }
  for (let it = 0; it < 2; it++) {
    for (let i = 0; i < B.length; i++) {
      const a = B[i];
      for (let j = i + 1; j < B.length; j++) {
        const c = B[j];
        const dx = c.x - a.x, dy = c.y - a.y, rr = a.r + c.r, d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr || d2 < 1e-9) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ov = rr - d;
        const im1 = 1 / a.m, im2 = 1 / c.m, sm = im1 + im2;
        a.x -= nx * ov * im1 / sm; a.y -= ny * ov * im1 / sm;
        c.x += nx * ov * im2 / sm; c.y += ny * ov * im2 / sm;
        const vn = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
        if (vn < 0) {
          const e = (a.ball || c.ball) ? E_BALL : E_DISC, jj = -(1 + e) * vn / sm;
          a.vx -= jj * nx * im1; a.vy -= jj * ny * im1; c.vx += jj * nx * im2; c.vy += jj * ny * im2;
          if (LOG && vn < -60) HITS.push([0, -vn, (a.x + c.x) / 2, (a.y + c.y) / 2]);
        }
      }
      if (a.x > FL + a.r && a.x < FR - a.r && a.y > FT + a.r && a.y < FB - a.r) continue;
      for (let s = 0; s < SEGS.length; s++) segHit(a, SEGS[s]);
    }
  }
  const ball = B[0];
  if (ball.y > mT && ball.y < mB) {
    if (ball.x + ball.r < FL) return 2;    // ball in left goal  -> right team (1) scores
    if (ball.x - ball.r > FR) return 1;    // ball in right goal -> left team (0) scores
  }
  return 0;
}
function advance(B, dt) {
  let mx = 0;
  for (const b of B) { const s = b.vx * b.vx + b.vy * b.vy; if (s > mx) mx = s; }
  const n = Math.max(1, Math.ceil(Math.sqrt(mx) * dt / 8)), h = dt / n;
  for (let k = 0; k < n; k++) { const ev = sub(B, h); if (ev) return ev; }
  return 0;
}
function simulate(B, maxSteps) {
  for (let i = 0; i < maxSteps; i++) {
    const ev = advance(B, DT); if (ev) return ev;
    if (!moving(B)) return 0;
  }
  return 0;
}
/*PHYSICS_END*/

/* ---------- formations: [dx from own goal line, dy from centre line] ---------- */
const FORMS = [
  { name: '۱-۲-۲ حمله‌ای', pos: [[60,0],[190,-120],[190,120],[335,-75],[335,75]] },
  { name: '۲-۱-۲ متعادل', pos: [[75,-95],[75,95],[215,0],[345,-115],[345,115]] },
  { name: '۱-۳-۱ پهن', pos: [[60,0],[200,-150],[200,0],[200,150],[350,0]] },
  { name: '۳-۱-۱ دفاعی', pos: [[65,-130],[65,0],[65,130],[225,0],[355,0]] },
  { name: '۱-۱-۱-۱-۱ لوزی', pos: [[60,0],[165,-110],[165,110],[265,0],[370,0]] },
  { name: '۱-۱-۳ تهاجمی', pos: [[60,0],[185,0],[335,-150],[355,0],[335,150]] }
];

/* ---------- state ---------- */
const WIN = 3, TURN_TIME = 15, MAXDRAG = 150, MAXSPEED = 1750, MIN_DRAG = 14;
let mode = 'ai', diff = 'normal';
let forms = [0, 0], pick = 0;
let B = [], scores = [0, 0], turn = 0, state = 'menu', timer = TURN_TIME, paused = false;
let drag = null, ai = null, pendingTurnLabel = '';
let muted = localStorage.getItem('disc-muted') === '1';
const isHuman = t => mode === '2p' || t === 0;
const tName = t => mode === 'ai' ? (t ? 'کامپیوتر' : 'شما') : (t ? 'قرمز' : 'آبی');

/* ---------- audio ---------- */
let actx = null;
function audio() {
  if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f0, f1, dur, vol, type) {
  if (muted) return; const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type || 'triangle'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
const sfxHit = v => tone(240, 110, .09, Math.min(.35, .05 + v / 5000), 'triangle');
const sfxWall = v => tone(120, 60, .12, Math.min(.3, .04 + v / 6000), 'sine');
const sfxKick = () => tone(300, 90, .12, .25, 'triangle');
function sfxGoal() {
  if (muted) return; const a = audio(); if (!a) return;
  [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, f * 1.01, .5, .18, 'square'), i * 110));
  const len = a.sampleRate * 1.4, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.5);
  const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; fl.type = 'bandpass'; fl.frequency.value = 900; g.gain.value = .35;
  s.connect(fl); fl.connect(g); g.connect(a.destination); s.start();
}
function setMuted(m) { muted = m; localStorage.setItem('disc-muted', m ? '1' : '0'); $('bSnd').textContent = m ? '🔇' : '🔊'; }

/* ---------- canvas / view ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');
let dpr = 1, portrait = false, S = 1, offX = 0, offY = 0, shx = 0, shy = 0, shake = 0, now = 0, winFx = 0;
const TOP_PAD = 66;
function layout() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  portrait = innerHeight > innerWidth;
  const aw = innerWidth - 8, ah = innerHeight - TOP_PAD - 8;
  if (!portrait) { S = Math.min(aw / WW, ah / WH); offX = 4 + (aw - WW * S) / 2; offY = TOP_PAD + (ah - WH * S) / 2; }
  else { S = Math.min(aw / WH, ah / WW); offX = 4 + (aw - WH * S) / 2; offY = TOP_PAD + (ah - WW * S) / 2; }
}
function s2w(X, Y) { return portrait ? [WW - (Y - offY) / S, (X - offX) / S] : [(X - offX) / S, (Y - offY) / S]; }
function w2s(x, y) { return portrait ? [offX + y * S, offY + (WW - x) * S] : [offX + x * S, offY + y * S]; }
function setView() {
  const ox = offX + shx, oy = offY + shy;
  if (!portrait) ctx.setTransform(dpr * S, 0, 0, dpr * S, dpr * ox, dpr * oy);
  else ctx.setTransform(0, -dpr * S, dpr * S, 0, dpr * ox, dpr * (oy + WW * S));
}

/* ---------- drawing ---------- */
const TEAM = [
  { face: '#2a64e0', face2: '#12338a', rim: '#e8edf5', glow: '#4fd3ff' },
  { face: '#e0434d', face2: '#8f1621', rim: '#f6dc86', glow: '#ff9a6a' }
];
function drawField() {
  ctx.fillStyle = '#0f4a22'; ctx.fillRect(-20, -20, WW + 40, WH + 40);
  // ad boards

        if (i < 6 && H[1] > 200) fxRing(H[2], H[3], Math.min(1, H[1] / 1500));
      }
      HITS.length = 0;
      const bl = B[0]; if (bl && Math.hypot(bl.vx, bl.vy) > 260 && (++trailN % 2 === 0)) FX.push({ k: 'trail', x: bl.x, y: bl.y, t: 0, d: .3 });
    } else acc = 0;
    if (state === 'aim') {
      if (isHuman(turn)) {
        timer -= dt; setBar(timer / TURN_TIME);
        if (timer <= 0) { drag = null; endTurn(); }
      } else aiTick();
    }
  }
  draw();
  requestAnimationFrame(loop);
}
['menu', 'fsel', 'pause'].forEach(id => {
  const f = document.createElement('div'); f.className = 'floaters';
  for (let i = 0; i < 9; i++) {
    const e = document.createElement('i'); e.className = i % 3 === 0 ? 'bl' : (i % 2 ? 'rd' : 'bu');
    e.style.cssText = `left:${Math.random() * 100}%;--s:${26 + Math.random() * 42}px;animation-duration:${10 + Math.random() * 10}s;animation-delay:-${Math.random() * 14}s`;
    f.appendChild(e);
  }
  $(id).prepend(f);
});
window.addEventListener('resize', layout);
layout(); setMuted(muted);
B = []; 
requestAnimationFrame(loop);
window.__soccer = { advance, simulate, mk, cloneB, moving, SEGS, FL, FR, FT, FB, GD, CY, GW, MAXSPEED };
})();
</script>
