<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a4a14">
<title>گیاهان در برابر زامبی‌ها</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;background:#10300d;color:#fff;font-family:Vazirmatn,Tahoma,"Segoe UI",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;background:radial-gradient(circle at 50% 30%,#2c7a1c,#0c2a09);overflow:auto;animation:fade .35s}
.screen.dim{background:rgba(6,22,5,.82);backdrop-filter:blur(3px)}
.screen h1{margin:0;font-size:34px;line-height:1.3;text-align:center;color:#ffe066;text-shadow:0 3px 0 #7a3b00,0 0 22px rgba(255,220,80,.4);animation:drop .6s cubic-bezier(.2,1.5,.4,1)}
.screen h2{margin:0;font-size:26px;color:#ffe066;text-shadow:0 2px 0 #7a3b00}
.screen p{margin:0;color:#cfe9c4;font-size:14px;text-align:center;line-height:1.9;max-width:380px}
.col{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.btn{display:block;width:100%;padding:14px 16px;border:0;border-radius:14px;font-size:17px;font-weight:700;color:#1b1200;background:linear-gradient(#ffe57a,#f0b81c);box-shadow:0 4px 0 #8a5d00;transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5d00}
.btn.alt{background:linear-gradient(#5fd870,#2a9a3e);color:#fff;box-shadow:0 4px 0 #14602a}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.28)}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;width:100%;max-width:360px}
.lv{aspect-ratio:1;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.28);font-size:20px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .12s,background .2s;animation:pop .4s backwards}
.lv small{font-size:10px;opacity:.7;font-weight:400}
.lv.on{background:#ffe066;color:#1b1200;border-color:#ffe066}
.lv.lock{opacity:.35;pointer-events:none}
.lv:active{transform:scale(.92)}
.zrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:12px;color:#b9d8b0}
.zrow span{background:rgba(0,0,0,.25);border-radius:10px;padding:3px 9px}
a.topback{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;color:#e8f5ec;font-size:14px;text-decoration:none;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:8px 14px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-30px) scale(.8)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="screen" id="menu">
  <a class="topback" href="../">→ بازی‌ها</a>
  <h1>🌻 گیاهان در برابر<br>زامبی‌ها 🧟</h1>
  <p>زامبی‌ها از راست می‌آیند! با آفتاب‌هایی که جمع می‌کنی گیاه بکار تا به خانه نرسند.<br>یک کارت گیاه را بزن و بعد روی خانه‌ی چمن لمس کن. آفتاب‌ها را با لمس جمع کن.</p>
  <div class="levels" id="levels"></div>
  <div class="zrow"><span>🌱 ۶ گیاه</span><span>🧟 ۵ نوع زامبی</span><span>🚜 ماشین چمن‌زنی</span><span>⛏️ بیل</span></div>
  <div class="col"><button class="btn" id="bStart">شروع مرحله</button></div>
</div>

<div class="screen dim hidden" id="pause">
  <h2>توقف</h2>
  <div class="col">
    <button class="btn alt" id="pResume">ادامه بازی</button>
    <button class="btn" id="pRestart">شروع دوباره‌ی مرحله</button>
    <button class="btn ghost" id="pSound">صدا: روشن</button>
    <button class="btn ghost" id="pMenu">منوی مرحله‌ها</button>
  </div>
</div>

<div class="screen dim hidden" id="end">
  <h1 id="eT"></h1><p id="eP"></p>
  <div class="col"><button class="btn alt" id="eNext">مرحله‌ی بعد</button><button class="btn" id="eAgain">دوباره</button><button class="btn ghost" id="eMenu">منوی مرحله‌ها</button></div>
</div>

<script src="art.js"></script>
<script>
(() => {
'use strict';
const A = window.PVZ, { W, H, X0, Y0, CW, CH, COLS, ROWS, PK, SHOVEL, BANK } = A;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

/* ================= data ================= */
const TYPES = ['peashooter', 'sunflower', 'cherry', 'wallnut', 'potato', 'snowpea'];
const DEF = { peashooter: { cost: 100, cd: 5, hp: 300 }, sunflower: { cost: 50, cd: 5, hp: 300 }, cherry: { cost: 150, cd: 22, hp: 300 }, wallnut: { cost: 50, cd: 16, hp: 4000 }, potato: { cost: 25, cd: 16, hp: 300 }, snowpea: { cost: 175, cd: 5, hp: 300 } };
const ZDEF = { normal: { hp: 270, speed: 20 }, cone: { hp: 640, speed: 20 }, bucket: { hp: 1370, speed: 20 }, flag: { hp: 270, speed: 26 }, pole: { hp: 500, speed: 46 } };
const MAXLV = 10, ARM = 8, FUSE = 1.1;
let unlocked = Math.max(1, Math.min(MAXLV, +localStorage.getItem('pvz-unlocked') || 1)), level = Math.min(unlocked, MAXLV);
let muted = localStorage.getItem('pvz-muted') === '1';

/* ================= state ================= */
let phase = 'menu', paused = false, T = 0, clock = 0, sunBank = 50, sel = -1, shovelOn = false;
let plants = [], grid = [], zombies = [], peas = [], suns = [], mowers = [], fxs = [], parts = [], cds = [0, 0, 0, 0, 0, 0];
let sched = [], si = 0, total = 1, killed = 0, skyT = 6, readyT = 0, msg = null, shake = 0, endT = 0, hover = null, waveShown = false, lostT = 0;
const rowY = r => Y0 + (r + .5) * CH, colX = c => X0 + (c + .5) * CW;

/* ================= audio ================= */
let actx = null;
function audio() { if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
function tone(f0, f1, d, v, type) { if (muted) return; const a = audio(); if (!a) return; const o = a.createOscillator(), g = a.createGain(), t = a.currentTime; o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02); }
function noise(d, v) { if (muted) return; const a = audio(); if (!a) return; const n = a.sampleRate * d, b = a.createBuffer(1, n, a.sampleRate), x = b.getChannelData(0); for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2); const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter(); s.buffer = b; f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = v; s.connect(f); f.connect(g); g.connect(a.destination); s.start(); }
const sfx = { sun: () => { tone(880, 1320, .12, .12); setTimeout(() => tone(1320, 1760, .12, .1), 70); }, plant: () => tone(220, 90, .14, .22, 'triangle'), hit: () => tone(420, 200, .05, .05, 'square'), boom: () => { noise(.6, .5); tone(120, 40, .5, .3, 'sawtooth'); }, groan: () => tone(110, 70, .5, .06, 'sawtooth'), win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, f, .3, .15, 'triangle'), i * 140)), lose: () => [330, 262, 196, 147].forEach((f, i) => setTimeout(() => tone(f, f * .98, .4, .15, 'sawtooth'), i * 220)) };

/* ================= view ================= */
let dpr = 1, portrait = false, S = 1, ox = 0, oy = 0, bgCv = null;
function layout() {
  dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr); portrait = innerHeight > innerWidth;
  if (!portrait) { S = Math.min(innerWidth / W, innerHeight / H); ox = (innerWidth - W * S) / 2; oy = (innerHeight - H * S) / 2; }
  else { S = Math.min(innerHeight / W, innerWidth / H); ox = (innerWidth - H * S) / 2; oy = (innerHeight - W * S) / 2; }
  const sc = S * dpr; bgCv = bgCv || document.createElement('canvas'); bgCv.width = Math.ceil(W * sc); bgCv.height = Math.ceil(H * sc);
  const g = bgCv.getContext('2d'); g.setTransform(sc, 0, 0, sc, 0, 0); A.bg(g);
}
function setView() { if (!portrait) ctx.setTransform(dpr * S, 0, 0, dpr * S, dpr * ox, dpr * oy); else ctx.setTransform(0, dpr * S, -dpr * S, 0, dpr * (ox + H * S), dpr * oy); }
const s2w = (X, Y) => portrait ? [(Y - oy) / S, H - (X - ox) / S] : [(X - ox) / S, (Y - oy) / S];

/* ================= level setup ================= */
function buildSchedule(L) {
  const n = 6 + L * 4, finalN = Math.max(4, Math.round(n * .28)), early = n - finalN - 2, s = [];
  const pick = () => { const r = Math.random(); let a = 0; if (L >= 6 && r < (a += .15)) return 'bucket'; if (L >= 4 && r < (a += .2)) return 'pole'; if (L >= 2 && r < (a += .28)) return 'cone'; return 'normal'; };
  let t = 16;
  for (let i = 0; i < early; i++) { s.push({ t, type: i < 2 ? 'normal' : pick(), row: Math.floor(Math.random() * ROWS) }); t += Math.max(1.8, (11 - L * .7) * (.65 + Math.random() * .7)); if (i === Math.floor(early / 2)) s.push({ t: t - 1, type: 'flag', row: Math.floor(Math.random() * ROWS) }); }
  t += 7; const fw = t; s.push({ t, type: 'flag', row: 2, final: true });
  for (let k = 0; k < finalN; k++) s.push({ t: fw + 1 + k * (4 / finalN) + Math.random() * .5, type: pick(), row: Math.floor(Math.random() * ROWS) });
  s.sort((a, b) => a.t - b.t); return s;
}
function startLevel(L) {
  level = L; sunBank = 50; sel = -1; shovelOn = false; plants = []; grid = new Array(ROWS * COLS).fill(null); zombies = []; peas = []; suns = []; fxs = []; parts = []; cds = [0, 0, 0, 0, 0, 0];
  mowers = Array.from({ length: ROWS }, (_, r) => ({ r, x: 22, state: 0 })); sched = buildSchedule(L); si = 0; total = sched.length; killed = 0; T = 0; skyT = 5; readyT = 3.2; msg = null; shake = 0; waveShown = false; lostT = 0;
  phase = 'ready'; paused = false; ['menu', 'pause', 'end'].forEach(i => $(i).classList.add('hidden')); audio();
}
function showMenu() { phase = 'menu'; paused = false; ['pause', 'end'].forEach(i => $(i).classList.add('hidden')); $('menu').classList.remove('hidden'); buildLevels(); }
function buildLevels() {
  $('levels').innerHTML = ''; for (let i = 1; i <= MAXLV; i++) { const b = document.createElement('button'); b.className = 'lv' + (i === level ? ' on' : '') + (i > unlocked ? ' lock' : ''); b.style.animationDelay = (i * 30) + 'ms'; b.innerHTML = '1-' + i + '<small>' + (i > unlocked ? '🔒' : '🧟 ' + (6 + i * 4 + 2)) + '</small>'; b.onclick = () => { level = i; buildLevels(); }; $('levels').appendChild(b); }
}

/* ================= game logic ================= */
const zRow = z => z.row;
function addSun(x, y, v, mode) { suns.push({ x, y, v: v || 25, mode, t: 0, vy: 0, fx: x, fy: y, ty: mode === 'sky' ? Y0 + 40 + Math.random() * (ROWS * CH - 90) : y + 38, life: 0, fly: false }); }
function spawnZ(e) { const d = ZDEF[e.type]; zombies.push({ type: e.type, row: e.row, x: X0 + COLS * CW + 30 + Math.random() * 20, hp: d.hp, max: d.hp, t: Math.random() * 6, eat: null, slow: 0, jump: null, jumped: false, dead: 0, y: rowY(e.row) + 40 }); if (Math.random() < .4) sfx.groan(); }
function killZ(z) { if (!z.dead) { z.hp = -1; z.dead = .001; killed++; } }
function dmgZ(z, d) { if (z.dead) return; z.hp -= d; z.flash = .1; if (z.hp <= 0) killZ(z); }
function explode(x, y, big) { fxs.push({ type: 'boom', x, y, t: 0, big }); shake = big ? .35 : .2; sfx.boom(); }
function plantAt(r, c, type) {
  const d = DEF[type], p = { type, r, c, x: colX(c), y: rowY(r) + 4, hp: d.hp, max: d.hp, t: Math.random() * 5, cd: type === 'sunflower' ? 5 + Math.random() * 3 : 0.4, arm: 0, fuse: 0 };
  plants.push(p); grid[r * COLS + c] = p; return p;
}
function removePlant(p) { grid[p.r * COLS + p.c] = null; plants.splice(plants.indexOf(p), 1); }

function update(dt) {
  clock += dt;
  if (phase === 'ready') { readyT -= dt; if (readyT <= 0) { phase = 'play'; msg = null; } return; }
  if (phase !== 'play') { if (phase === 'win' || phase === 'lose') { endT += dt; } updateFx(dt); return; }
  T += dt;
  // cooldowns / sky sun
  for (let i = 0; i < 6; i++) if (cds[i] > 0) cds[i] -= dt;
  skyT -= dt; if (skyT <= 0) { skyT = 7 + Math.random() * 4; addSun(X0 + 30 + Math.random() * (COLS * CW - 60), -30, 25, 'sky'); }
  // schedule
  while (si < sched.length && T >= sched[si].t) { const e = sched[si++]; spawnZ(e); if (e.final && !waveShown) { waveShown = true; msg = { text: 'A HUGE WAVE OF ZOMBIES IS APPROACHING!', t: 4 }; } }
  if (msg && msg.t > 0) { msg.t -= dt; if (msg.t <= 0) msg = null; }
  // plants
  for (const p of plants.slice()) {
    p.t += dt;
    if (p.type === 'sunflower') { p.cd -= dt; if (p.cd <= 0) { p.cd = 22; addSun(p.x - 10, p.y - 20, 25, 'sf'); suns[suns.length - 1].fx = p.x; suns[suns.length - 1].tx = p.x + (Math.random() - .5) * 60; } }
    else if (p.type === 'peashooter' || p.type === 'snowpea') { p.cd -= dt; if (p.cd <= 0 && zombies.some(z => z.row === p.r && !z.dead && z.x > p.x && z.x < W + 10)) { p.cd = 1.45; peas.push({ x: p.x + 44, y: p.y - 18, row: p.r, snow: p.type === 'snowpea' }); } }
    else if (p.type === 'potato') { if (p.arm < ARM) p.arm += dt; else if (zombies.some(z => z.row === p.r && !z.dead && Math.abs(z.x - p.x) < CW * .62)) { zombies.forEach(z => { if (z.row === p.r && !z.dead && Math.abs(z.x - p.x) < CW * 1.1) dmgZ(z, 1800); }); explode(p.x, p.y, false); removePlant(p); } }
    else if (p.type === 'cherry') { p.fuse += dt; if (p.fuse >= FUSE) { zombies.forEach(z => { if (!z.dead && Math.abs(z.row - p.r) <= 1 && Math.abs(z.x - p.x) < CW * 1.6) dmgZ(z, 1800); }); explode(p.x, p.y, true); removePlant(p); } }
  }
  // peas
  for (let i = peas.length - 1; i >= 0; i--) {
    const q = peas[i]; q.x += 300 * dt; let hit = null;
    for (const z of zombies) if (z.row === q.row && !z.dead && q.x > z.x - 26 && q.x < z.x + 18 && (!hit || z.x < hit.x)) hit = z;
    if (hit) { dmgZ(hit, 20); if (q.snow) hit.slow = 4; for (let k = 0; k < 4; k++) parts.push({ x: q.x, y: q.y, vx: -30 - Math.random() * 90, vy: (Math.random() - .5) * 120, life: .35, c: q.snow ? '#bfe9ff' : '#9fe05a' }); sfx.hit(); peas.splice(i, 1); }
    else if (q.x > W + 20) peas.splice(i, 1);
  }
  // zombies
  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i]; z.t += dt; if (z.flash > 0) z.flash -= dt;
    if (z.dead) { z.dead += dt / .9; if (z.dead >= 1) zombies.splice(i, 1); continue; }
    if (z.slow > 0) z.slow -= dt;
    const d = ZDEF[z.type]; let sp = d.speed * (z.slow > 0 ? .5 : 1); if (z.type === 'pole' && z.jumped) sp = 20 * (z.slow > 0 ? .5 : 1);
    if (z.jump != null) { z.jump += dt / .85; z.x -= CW * 1.55 * dt / .85; if (z.jump >= 1) { z.jump = null; z.jumped = true; } continue; }
    // find a plant to chew / jump
    let tgt = null; for (const p of plants) if (p.r === z.row && p.x - CW * .35 < z.x && z.x < p.x + CW * .5) { if (!tgt || p.x > tgt.x) tgt = p; }
    if (z.type === 'pole' && !z.jumped) { const nx = plants.find(p => p.r === z.row && p.x < z.x && z.x - p.x < CW * .85); if (nx) { z.jump = 0; continue; } }
    if (tgt) { z.eat = tgt; tgt.hp -= 100 * dt * (z.slow > 0 ? .5 : 1); tgt.hitT = .1; if (tgt.hp <= 0) { removePlant(tgt); z.eat = null; } }
    else { z.eat = null; z.x -= sp * dt; }
    const m = mowers[z.row]; if (z.x < X0 - 6 && m.state === 0) { m.state = 1; sfx.boom(); }
    if (z.x < X0 - 52 && m.state === 2 && phase === 'play') { phase = 'lose'; endT = 0; lostT = 0; sfx.lose(); }
  }
  // mowers
  for (const m of mowers) if (m.state === 1) { m.x += 380 * dt; for (const z of zombies) if (z.row === m.r && !z.dead && Math.abs(z.x - m.x) < 46) killZ(z); if (m.x > W + 60) m.state = 2; }
  // suns
  for (let i = suns.length - 1; i >= 0; i--) {
    const s = suns[i];
    if (s.fly) { const dx = BANK.x - s.x, dy = BANK.y - s.y, dd = Math.hypot(dx, dy), st = Math.max(dd, 1), v = 900 * dt; if (dd < v + 6) { sunBank += s.v; sfx.sun(); suns.splice(i, 1); continue; } s.x += dx / st * v; s.y += dy / st * v; continue; }
    s.life += dt;
    if (s.mode === 'sky') { if (s.y < s.ty) s.y += 55 * dt; else if (s.life > 14) { suns.splice(i, 1); } }
    else { s.t += dt; const k = Math.min(1, s.t / .6), tx = s.tx == null ? s.fx : s.tx; s.x = s.fx + (tx - s.fx) * k; s.y = s.fy + (s.ty - s.fy) * k - Math.sin(Math.PI * k) * 46; if (s.life > 14) suns.splice(i, 1); }
  }
  updateFx(dt);
  // win
  if (si >= sched.length && zombies.length === 0 && phase === 'play') { phase = 'win'; endT = 0; sfx.win(); if (level >= unlocked && level < MAXLV) { unlocked = level + 1; localStorage.setItem('pvz-unlocked', unlocked); } }
}
function updateFx(dt) {
  for (let i = fxs.length - 1; i >= 0; i--) { fxs[i].t += dt; if (fxs[i].t > .6) fxs.splice(i, 1); }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; if (p.life <= 0) parts.splice(i, 1); }
  if (shake > 0) shake -= dt;
  if (phase === 'win' && endT > 2.2 && $('end').classList.contains('hidden')) endScreen(true);
  if (phase === 'lose' && endT > 2.6 && $('end').classList.contains('hidden')) endScreen(false);
}
function endScreen(win) {
  $('eT').textContent = win ? (level >= MAXLV ? '🏆 همه‌ی مرحله‌ها تمام شد!' : '🌻 مرحله تمام شد!') : '🧠 زامبی‌ها به خانه رسیدند!';
  $('eP').textContent = win ? 'مرحله‌ی 1-' + level + ' را با موفقیت پشت سر گذاشتی.' : 'مغزهایت را خوردند... دوباره امتحان کن و گیاهان بیشتری بکار.';
  $('eNext').classList.toggle('hidden', !(win && level < MAXLV)); $('end').classList.remove('hidden');
}

/* ================= input ================= */
function toWorld(e) { const r = cv.getBoundingClientRect(); return s2w(e.clientX - r.left, e.clientY - r.top); }
cv.addEventListener('pointermove', e => { hover = toWorld(e); });
cv.addEventListener('pointerdown', e => {
  audio(); if (phase !== 'play' && phase !== 'ready') return; const [x, y] = toWorld(e); hover = [x, y]; if (paused) return;
  if (x > 819 && x < 953 && y < 40) { pauseGame(); return; }
  // collect suns first
  for (let i = suns.length - 1; i >= 0; i--) { const s = suns[i]; if (!s.fly && Math.hypot(s.x - x, s.y - y) < 40) { s.fly = true; return; } }
  if (phase !== 'play') return;
  if (y < PK.y + PK.h + 8 && x >= PK.x0 && x < PK.x0 + 6 * PK.step) { const i = Math.floor((x - PK.x0) / PK.step); if (x < PK.x0 + i * PK.step + PK.w && i < 6) { shovelOn = false; sel = sel === i ? -1 : i; } return; }
  if (x > SHOVEL.x && x < SHOVEL.x + SHOVEL.w && y < SHOVEL.h) { sel = -1; shovelOn = !shovelOn; return; }
  const c = Math.floor((x - X0) / CW), r = Math.floor((y - Y0) / CH);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
  const cur = grid[r * COLS + c];
  if (shovelOn) { if (cur) { removePlant(cur); sfx.plant(); } shovelOn = false; return; }
