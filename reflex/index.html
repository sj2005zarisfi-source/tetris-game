<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>ریفلکس ۴ نفره</title>
<style>
:root{--c1:#2f80ff;--c2:#ff4d5e;--c3:#2fd05a;--c4:#ffb92e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;background:#070b14;color:#fff;font-family:Vazirmatn,Tahoma,"Segoe UI",Arial,sans-serif}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:14px;padding:max(16px,env(safe-area-inset-top)) 18px 18px;background:radial-gradient(circle at 50% 0,#1b2a5a,#070b14 65%);overflow-y:auto;touch-action:pan-y;animation:fade .35s}
.wrap{margin:auto;width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;text-align:center;font-size:34px;line-height:1.3;background:linear-gradient(90deg,#4fa0ff,#ff6a7a,#4fe07a,#ffc24a);-webkit-background-clip:text;background-clip:text;color:transparent;animation:drop .6s cubic-bezier(.2,1.5,.4,1)}
.sub{text-align:center;color:#9fb0d8;font-size:14px;line-height:1.8;margin:0}
.grp{display:flex;flex-direction:column;gap:8px}
.grp label{font-size:14px;color:#9fb0d8}
.seg{display:flex;border:1.5px solid rgba(255,255,255,.22);border-radius:16px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:12px 4px;font-size:16px;transition:background .2s,color .2s}
.seg button.on{background:#4fa0ff;color:#04101f;font-weight:700}
.btn{display:block;width:100%;padding:14px 16px;border:0;border-radius:16px;font-size:17px;font-weight:700;color:#04101f;background:linear-gradient(#7fc0ff,#3f8cf0);box-shadow:0 4px 0 #1e5aa8;transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1e5aa8}
.btn.alt{background:linear-gradient(#ffe57a,#f0b81c);box-shadow:0 4px 0 #8a5d00}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.25)}
a.topback{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;color:#e8f0ff;font-size:14px;text-decoration:none;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:8px 14px}
.list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px}
.mode{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.04);font-size:15px;transition:background .2s}
.mode .ck{width:24px;height:24px;border-radius:7px;border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:16px;color:#04101f}
.mode.on{background:rgba(79,160,255,.16);border-color:#4fa0ff}.mode.on .ck{background:#4fa0ff;border-color:#4fa0ff}
.mode small{display:block;color:#9fb0d8;font-size:12px}
.row2{display:flex;gap:8px}.row2 .btn{padding:11px}
/* ---- game ---- */
#game{direction:ltr;position:fixed;inset:0;display:grid;gap:7px;padding:7px;background:#070b14;grid-template-columns:var(--cl,0px) 1fr var(--cr,0px);grid-template-rows:var(--rt,26%) 1fr var(--rb,26%)}
.pad{position:relative;border-radius:20px;overflow:hidden;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 20%,#0b1020);touch-action:none;transition:background .15s,box-shadow .15s,transform .08s}
.pad:active{transform:scale(.985)}
.pad.p1{--c:var(--c1);grid-column:1/4;grid-row:3}.pad.p2{--c:var(--c2);grid-column:1/4;grid-row:1}
.pad.p3{--c:var(--c3);grid-column:1;grid-row:2}.pad.p4{--c:var(--c4);grid-column:3;grid-row:2}
.pad .in{position:absolute;left:50%;top:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none}
.pad .nm{font-size:15px;color:var(--c);font-weight:700}
.pad .sc{font-size:50px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.pad .msg{font-size:17px;min-height:24px;font-weight:700}
.pad.win{background:#27d65c;box-shadow:0 0 34px #27d65c;color:#04210e}.pad.win .nm{color:#04210e}
.pad.lose{background:#ff3b4a;box-shadow:0 0 34px #ff3b4a}.pad.lose .nm{color:#fff}
.pad.dim{opacity:.45}
.pad.off{display:none}
.pad.p3 .nm,.pad.p4 .nm{display:none}.pad.p3 .sc,.pad.p4 .sc{font-size:36px}.pad.p3 .msg,.pad.p4 .msg{font-size:14px;min-height:20px}
#arena{position:relative;grid-column:2;grid-row:2;border-radius:20px;background:#0e1424;border:2px solid rgba(255,255,255,.1);overflow:hidden;display:flex;flex-direction:column;transition:background .08s}
.half{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
.half.r{transform:rotate(180deg)}
.one{flex:1;display:flex;align-items:center;justify-content:center}
.hint{position:absolute;left:0;right:0;text-align:center;font-size:13px;color:#8fa2d0;padding:0 8px;pointer-events:none}
.hint.b{bottom:6px}.hint.t{top:6px;transform:rotate(180deg)}
.big{font-size:clamp(40px,14vmin,120px);font-weight:800;text-align:center;line-height:1.1}
.txt{font-size:clamp(22px,6vmin,44px);font-weight:700;text-align:center;padding:0 14px;line-height:1.5}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:clamp(24px,7vmin,52px);text-align:center}
.shapes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;max-width:90%}
.bars{display:flex;flex-direction:column;gap:14px;width:80%}
.bar{height:clamp(14px,3.5vmin,26px);border-radius:8px;background:#4fa0ff;transition:none}
.bar.b2{background:#ff5c70}
.pm{display:grid;grid-template-columns:repeat(5,1fr);gap:2px 6px;font-size:clamp(22px,6vmin,40px);font-weight:800;text-align:center}
.dice{display:flex;gap:clamp(18px,6vmin,50px);font-size:clamp(46px,14vmin,110px);line-height:1}
.emo{font-size:clamp(60px,20vmin,160px);line-height:1}
#pause{position:absolute;top:6px;right:6px;z-index:5;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:rgba(7,11,20,.8);font-size:14px;display:none}
#stats{position:absolute;top:8px;left:8px;max-width:70%;font-size:12px;color:#9fb0d8;text-align:left;direction:ltr;z-index:4}
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(4,8,18,.82);backdrop-filter:blur(4px);animation:fade .3s}
.card{width:min(90%,380px);background:#0e1730;border:1.5px solid rgba(255,255,255,.2);border-radius:24px;padding:22px 18px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.card h2{margin:0;font-size:26px;color:#ffe066}
.card p{margin:0;font-size:15px;line-height:1.9;color:#cdd9f5;white-space:pre-line}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-24px) scale(.85)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.stim{animation:pulse .12s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>

<section class="screen" id="menu">
  <a class="topback" href="../">→ بازی‌ها</a>
  <div class="wrap">
    <h1>⚡ ریفلکس ۴ نفره</h1>
    <p class="sub">بازی واکنش سریع برای ۱ تا ۴ نفر روی یک صفحه!<br>هر کس زودتر وقتی شرط برقرار شد روی صفحه‌ی رنگی خودش بزند، امتیاز می‌گیرد. اگر اشتباه بزنی یک امتیاز کم می‌شود.</p>
    <div class="grp"><label>تعداد بازیکن</label><div class="seg" id="sPl"><button data-v="1">تمرین ۱</button><button data-v="2">۲</button><button data-v="3">۳</button><button data-v="4">۴</button></div></div>
    <div class="grp"><label>سختی</label><div class="seg" id="sDf"><button data-v="0">آسان</button><button data-v="1">متوسط</button><button data-v="2">سخت</button><button data-v="3">دیوانه</button></div></div>
    <div class="grp" id="gTarget"><label>امتیاز لازم برای بردن</label><div class="seg" id="sTg"><button data-v="5">۵</button><button data-v="10">۱۰</button><button data-v="15">۱۵</button><button data-v="20">۲۰</button></div></div>
    <button class="btn alt" id="bStart">شروع بازی</button>
    <button class="btn ghost" id="bModes">انتخاب حالت‌ها</button>
  </div>
</section>

<section class="screen hidden" id="modes">
  <h2 style="margin:6px 0 0;color:#ffe066">حالت‌های بازی</h2>
  <p class="sub" id="mCount"></p>
  <div class="row2" style="width:100%;max-width:420px"><button class="btn ghost" id="mAll">همه</button><button class="btn ghost" id="mNone">هیچ‌کدام</button><button class="btn ghost" id="mRand">ترتیب تصادفی: روشن</button></div>
  <div class="list" id="mList"></div>
  <div style="width:100%;max-width:420px"><button class="btn" id="mDone">تأیید</button></div>
</section>

<section id="game" class="hidden">
  <div class="pad p2" data-p="2"><div class="in"><div class="nm">بازیکن ۲</div><div class="sc">0</div><div class="msg"></div></div></div>
  <div class="pad p3" data-p="3"><div class="in"><div class="nm">بازیکن ۳</div><div class="sc">0</div><div class="msg"></div></div></div>
  <div id="arena"><div id="stats"></div><button id="pause" aria-label="توقف">❚❚</button><div class="hint t" id="hT"></div><div id="stimBox" style="flex:1;display:flex;flex-direction:column"></div><div class="hint b" id="hB"></div></div>
  <div class="pad p4" data-p="4"><div class="in"><div class="nm">بازیکن ۴</div><div class="sc">0</div><div class="msg"></div></div></div>
  <div class="pad p1" data-p="1"><div class="in"><div class="nm">بازیکن ۱</div><div class="sc">0</div><div class="msg"></div></div></div>
</section>

<div class="ov hidden" id="pauseOv"><div class="card"><h2>توقف</h2><button class="btn alt" id="pResume">ادامه</button><button class="btn" id="pSound">صدا: روشن</button><button class="btn ghost" id="pMenu">منوی اصلی</button></div></div>
<div class="ov hidden" id="endOv"><div class="card"><h2 id="eT"></h2><p id="eP"></p><button class="btn alt" id="eAgain">دوباره</button><button class="btn ghost" id="eMenu">منوی اصلی</button></div></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id), $$ = s => [...document.querySelectorAll(s)];
const rnd = a => a[Math.floor(Math.random() * a.length)], ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1)), shuf = a => a.slice().sort(() => Math.random() - .5);
const fa = v => String(v).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const T_SHOW = [2600, 2000, 1500, 1050];                       // how long a prompt stays per difficulty
const EVENTS_PER_MODE = 5, SOLO_EVENTS = 20, P_CORRECT = .42;
const PCOL = ['', '#2f80ff', '#ff4d5e', '#2fd05a', '#ffb92e'];

/* ================= small renderers ================= */
const COLS = [['قرمز', '#ff3b4a'], ['آبی', '#3f8cff'], ['سبز', '#2fd05a'], ['زرد', '#ffd23a'], ['بنفش', '#b36cff'], ['نارنجی', '#ff8a1a']];
const SH = ['circle', 'square', 'triangle', 'pentagon', 'star', 'hexagon', 'diamond', 'cross'];
function poly(n, r, rot) { let s = ''; for (let i = 0; i < n; i++) { const a = rot + i * 2 * Math.PI / n; s += (50 + Math.cos(a) * r).toFixed(1) + ',' + (50 + Math.sin(a) * r).toFixed(1) + ' '; } return s; }
function shape(t, col, size) {
  let b = '';
  if (t === 'circle') b = '<circle cx="50" cy="50" r="40"/>';
  else if (t === 'square') b = '<rect x="12" y="12" width="76" height="76" rx="4"/>';
  else if (t === 'triangle') b = `<polygon points="${poly(3, 46, -Math.PI / 2)}"/>`;
  else if (t === 'pentagon') b = `<polygon points="${poly(5, 44, -Math.PI / 2)}"/>`;
  else if (t === 'hexagon') b = `<polygon points="${poly(6, 44, 0)}"/>`;
  else if (t === 'diamond') b = `<polygon points="${poly(4, 46, -Math.PI / 2)}"/>`;
  else if (t === 'star') { let s = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 20 : 46; s += (50 + Math.cos(a) * r).toFixed(1) + ',' + (50 + Math.sin(a) * r).toFixed(1) + ' '; } b = `<polygon points="${s}"/>`; }
  else b = '<path d="M38 8h24v30h30v24H62v30H38V62H8V38h30z"/>';
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" fill="${col}">${b}</svg>`;
}
const vmin = () => Math.min(innerWidth, innerHeight);
const rcol = () => rnd(COLS)[1];

/* ================= the mini-games ================= */
const ANIMALS = ['🐶', '🐱', '🐘', '🦁', '🐟', '🦆', '🐢', '🐝', '🦊', '🐸', '🦉', '🐧'], THINGS = ['🚗', '📱', '🌲', '🍕', '⚽', '🏠', '🪑', '🔨', '📚', '🌻', '⌚', '🎸'];
const FLY = ['🦅', '🦆', '🐝', '🦋', '✈️', '🚁', '🪁', '🦉', '🎈'], NOFLY = ['🐕', '🚗', '🐟', '🍎', '🐢', '🐘', '🏠', '🚲', '🌲'];
const VEH = ['🚗', '🚲', '🚂', '✈️', '🚀', '🛵', '🚌', '🚁', '⛵', '🚜'], NOVEH = ['🐘', '🌲', '🍕', '🏠', '⚽', '🐶', '🌻', '📚'];
const HUMAN = ['🏠', '🚗', '📱', '🔨', '🪑', '📚', '⌚', '🎸', '🛋️', '💡'], NATURE = ['🌲', '🐘', '🌋', '⛰️', '🌻', '🐟', '🍎', '🌊', '🐝', '🦋'];
const FLAGS = [['🇮🇷', 'ایران'], ['🇹🇷', 'ترکیه'], ['🇫🇷', 'فرانسه'], ['🇩🇪', 'آلمان'], ['🇮🇹', 'ایتالیا'], ['🇪🇸', 'اسپانیا'], ['🇧🇷', 'برزیل'], ['🇦🇷', 'آرژانتین'], ['🇯🇵', 'ژاپن'], ['🇨🇳', 'چین'], ['🇰🇷', 'کره‌ی جنوبی'], ['🇮🇳', 'هند'], ['🇷🇺', 'روسیه'], ['🇬🇧', 'بریتانیا'], ['🇺🇸', 'آمریکا'], ['🇨🇦', 'کانادا'], ['🇦🇺', 'استرالیا'], ['🇪🇬', 'مصر'], ['🇸🇦', 'عربستان'], ['🇳🇱', 'هلند'], ['🇸🇪', 'سوئد'], ['🇨🇭', 'سوئیس'], ['🇵🇹', 'پرتغال'], ['🇲🇽', 'مکزیک']];
const emojiMode = (id, fa_, hint, yes, no) => ({ id, fa: fa_, hint, next() { const c = Math.random() < P_CORRECT; return { correct: c, html: `<div class="emo">${rnd(c ? yes : no)}</div>` }; } });
const MODES = [
  { id: 'white', fa: 'صفحه‌ی سفید', hint: 'وقتی صفحه سفید شد بزن!', next(d) { const c = Math.random() < .38; return { correct: c, bg: c ? '#ffffff' : rnd(['#ff3b4a', '#3f8cff', '#2fd05a', '#ffd23a', '#b36cff', '#ff8a1a']), html: '', dur: c ? T_SHOW[d] * .8 : ri(650, 1500), noGap: true }; } },
  { id: 'count0', fa: 'شمارش معکوس', hint: 'وقتی شمارش به صفر رسید بزن!', n: -1, next(d) { if (this.n < 0) this.n = ri(3, 7); const v = this.n--; return { correct: v === 0, html: `<div class="big">${v}</div>`, two: true, dur: v === 0 ? T_SHOW[d] * .8 : 560 - d * 60, noGap: true }; } },
  { id: 'circle', fa: 'دایره پیدا کن', hint: 'وقتی دایره دیدی بزن!', next() { const c = Math.random() < P_CORRECT; return { correct: c, html: shape(c ? 'circle' : rnd(SH.slice(1)), rcol(), vmin() * .32) }; } },
  { id: 'sad', fa: 'ایموجی غمگین', hint: 'وقتی چهره‌ی غمگین دیدی بزن!', next() { const c = Math.random() < P_CORRECT, F = ['😀', '😃', '😄', '🙂', '😊', '😁'], S = ['😞', '😟', '☹️', '😢'], at = ri(0, 8); let h = ''; for (let i = 0; i < 9; i++) h += `<div>${c && i === at ? rnd(S) : rnd(F)}</div>`; return { correct: c, html: `<div class="grid3">${h}</div>` }; } },
  { id: 'count', fa: 'تعداد شکل‌ها', hint: 'وقتی تعداد شکل‌ها با عدد برابر بود بزن!', next(d) { const n = ri(2, 6 + d), c = Math.random() < P_CORRECT; let k = n; if (!c) { do { k = n + rnd([-2, -1, 1, 2]); } while (k < 1 || k === n); } const col = rcol(), sz = vmin() * .1; return { correct: c, two: true, html: `<div class="big">${n}</div><div class="shapes" style="margin-top:8px">${Array.from({ length: k }, () => shape(rnd(['circle', 'square', 'star']), col, sz)).join('')}</div>` }; } },
  { id: 'eq', fa: 'معادله', hint: 'وقتی معادله درست بود بزن!', next(d) { const m = 9 + d * 6, a = ri(2, m), b = ri(2, m), op = rnd(d >= 2 ? ['+', '−', '×'] : ['+', '−']); let ans = op === '+' ? a + b : op === '−' ? a - b : a * b; const c = Math.random() < P_CORRECT; let shown = ans; if (!c) { do { shown = ans + rnd([-1, 1, -2, 2, -10, 10]); } while (shown === ans); } return { correct: c, two: true, html: `<div class="big" style="direction:ltr;font-size:clamp(34px,10vmin,90px)">${a} ${op} ${b} = ${shown}</div>` }; } },
  { id: 'cname', fa: 'نام رنگ‌ها', hint: 'وقتی رنگِ نوشته با خود کلمه یکی بود بزن!', next() { const w = ri(0, 5), c = Math.random() < P_CORRECT; let k = w; if (!c) { do { k = ri(0, 5); } while (k === w); } return { correct: c, two: true, html: `<div class="big" style="color:${COLS[k][1]}">${COLS[w][0]}</div>` }; } },
  { id: 'same', fa: 'دو شکل مثل هم', hint: 'وقتی دو شکل مثل هم بود بزن!', next() { const c = Math.random() < P_CORRECT; let s = shuf(SH).slice(0, 5); if (c) s[ri(0, 4)] = s[ri(0, 4)]; if (c && new Set(s).size === 5) s[4] = s[0]; return { correct: new Set(s).size < 5, html: `<div class="shapes">${s.map(t => shape(t, rcol(), vmin() * .13)).join('')}</div>` }; } },
  { id: 'bars', fa: 'طول میله‌ها', hint: 'وقتی دو میله هم‌اندازه بودند بزن!', next(d) { const c = Math.random() < P_CORRECT, a = ri(35, 90), diff = Math.max(5, 30 - d * 8), b = c ? a : Math.min(95, Math.max(15, a + rnd([-1, 1]) * ri(diff - 3, diff + 6))); return { correct: a === b, html: `<div class="bars"><div class="bar" style="width:${a}%"></div><div class="bar b2" style="width:${b}%"></div></div>` }; } },
  { id: 'dice', fa: 'تاس‌ها', hint: 'وقتی مجموع تاس‌های آبی و قرمز برابر بود بزن!', next() { const c = Math.random() < P_CORRECT, D = '⚀⚁⚂⚃⚄⚅', a = ri(1, 6), b = ri(1, 6); let x, y; if (c) { x = ri(Math.max(1, a + b - 6), Math.min(6, a + b - 1)); y = a + b - x; } else { do { x = ri(1, 6); y = ri(1, 6); } while (x + y === a + b); } return { correct: c, two: true, html: `<div class="dice"><span style="color:#4fa0ff">${D[a - 1]}${D[b - 1]}</span><span style="color:#ff5c70">${D[x - 1]}${D[y - 1]}</span></div>` }; } },
  emojiMode('animal', 'حیوان؟', 'وقتی حیوان دیدی بزن!', ANIMALS, THINGS),
  emojiMode('fly', 'می‌تواند پرواز کند؟', 'وقتی چیزی که پرواز می‌کند دیدی بزن!', FLY, NOFLY),
  emojiMode('veh', 'وسیله‌ی نقلیه', 'وقتی وسیله‌ی نقلیه دیدی بزن!', VEH, NOVEH),
  emojiMode('human', 'ساخته‌ی انسان؟', 'وقتی چیزی ساخته‌ی انسان دیدی بزن!', HUMAN, NATURE),
  { id: 'flag', fa: 'پرچم درست؟', hint: 'وقتی پرچم با نام کشور می‌خواند بزن!', next() { const f = rnd(FLAGS), c = Math.random() < P_CORRECT; let n = f[1]; if (!c) { do { n = rnd(FLAGS)[1]; } while (n === f[1]); } return { correct: c, two: true, html: `<div class="emo" style="font-size:clamp(50px,16vmin,130px)">${f[0]}</div><div class="txt">${n}</div>` }; } },
  { id: 'alpha', fa: 'ترتیب حروف', hint: 'وقتی حروف به ترتیب الفبا بودند بزن!', next() { const c = Math.random() < P_CORRECT, s = ri(0, 18), L = Array.from({ length: 5 }, (_, i) => String.fromCharCode(65 + s + i)); if (!c) { const i = ri(0, 3); [L[i], L[i + 1]] = [L[i + 1], L[i]]; } return { correct: c, two: true, html: `<div class="big" style="direction:ltr;letter-spacing:.12em;font-size:clamp(34px,11vmin,90px)">${L.join('')}</div>` }; } },
  { id: 'plus', fa: 'بیشتر + یا −؟', hint: 'وقتی تعداد + از − بیشتر بود بزن!', next() { const c = Math.random() < P_CORRECT, tot = 15, pl = c ? ri(8, 11) : ri(4, 7); const arr = shuf(Array.from({ length: tot }, (_, i) => i < pl)); return { correct: pl > tot - pl, html: `<div class="pm">${arr.map(p => `<span style="color:${p ? '#4fe07a' : '#ff5c70'}">${p ? '+' : '−'}</span>`).join('')}</div>` }; } }
];

/* ================= settings ================= */
const ld = (k, d) => { const v = localStorage.getItem(k); return v === null ? d : (+v || 0); };
let players = ld('rf-pl', 2) || 2, diff = ld('rf-df', 1), target = ld('rf-tg', 10) || 10, randomOrder = localStorage.getItem('rf-rand') !== '0';
let enabled = (() => { try { const a = JSON.parse(localStorage.getItem('rf-modes') || 'null'); if (Array.isArray(a) && a.length) return a.filter(id => MODES.some(m => m.id === id)); } catch (e) {} return MODES.map(m => m.id); })();
if (!enabled.length) enabled = MODES.map(m => m.id);
let muted = localStorage.getItem('rf-muted') === '1';

/* ================= audio ================= */
let actx = null;
function beep(f, d, type, v) { if (muted) return; if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } if (!actx) return; if (actx.state === 'suspended') actx.resume(); const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime; o.type = type || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(v || .15, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .02); }
const sOk = () => { beep(880, .12, 'triangle'); setTimeout(() => beep(1320, .14, 'triangle'), 80); }, sBad = () => beep(150, .3, 'sawtooth', .18), sShow = () => beep(520, .05, 'sine', .05);

/* ================= menus ================= */
function seg(id, key, val, cb) { $$('#' + id + ' button').forEach(b => { b.classList.toggle('on', +b.dataset.v === val); b.onclick = () => { cb(+b.dataset.v); seg(id, key, +b.dataset.v, cb); }; }); }
function refreshMenu() {
  seg('sPl', 'pl', players, v => { players = v; localStorage.setItem('rf-pl', v); $('gTarget').classList.toggle('hidden', v === 1); });
  seg('sDf', 'df', diff, v => { diff = v; localStorage.setItem('rf-df', v); }); seg('sTg', 'tg', target, v => { target = v; localStorage.setItem('rf-tg', v); });
  $('gTarget').classList.toggle('hidden', players === 1);
}
function buildModes() {
  $('mList').innerHTML = ''; MODES.forEach(m => { const d = document.createElement('button'); d.className = 'mode' + (enabled.includes(m.id) ? ' on' : ''); d.style.textAlign = 'start'; d.innerHTML = `<span class="ck">${enabled.includes(m.id) ? '✓' : ''}</span><span>${m.fa}<small>${m.hint}</small></span>`;
    d.onclick = () => { const i = enabled.indexOf(m.id); if (i >= 0) enabled.splice(i, 1); else enabled.push(m.id); saveModes(); buildModes(); }; $('mList').appendChild(d); });
  $('mCount').textContent = enabled.length ? fa(enabled.length) + ' حالت انتخاب شده' : 'حداقل یک حالت انتخاب کن!'; $('mRand').textContent = 'ترتیب تصادفی: ' + (randomOrder ? 'روشن' : 'خاموش');
}
const saveModes = () => localStorage.setItem('rf-modes', JSON.stringify(enabled));
$('mAll').onclick = () => { enabled = MODES.map(m => m.id); saveModes(); buildModes(); }; $('mNone').onclick = () => { enabled = []; saveModes(); buildModes(); };
$('mRand').onclick = () => { randomOrder = !randomOrder; localStorage.setItem('rf-rand', randomOrder ? '1' : '0'); buildModes(); };
$('mDone').onclick = () => { if (!enabled.length) return; $('modes').classList.add('hidden'); $('menu').classList.remove('hidden'); };
$('bModes').onclick = () => { buildModes(); $('menu').classList.add('hidden'); $('modes').classList.remove('hidden'); };

/* ================= game engine ================= */
let G = null, timers = [], paused = false;
const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

function layoutPads() {
  const g = $('game'), r = (n, a) => g.style.setProperty(n, a), p = G.players;
  r('--cl', p >= 3 ? '20%' : '0px'); r('--cr', p >= 4 ? '20%' : '0px'); r('--rt', p >= 2 ? '24%' : '0px'); r('--rb', '24%');
  $$('.pad').forEach(el => { const n = +el.dataset.p; el.classList.toggle('off', n > p); });
  fitPads();
}
function fitPads() {
  const rot = { 1: 0, 2: 180, 3: 90, 4: -90 };
  $$('.pad').forEach(el => { if (el.classList.contains('off')) return; const n = +el.dataset.p, b = el.getBoundingClientRect(), inn = el.firstElementChild, side = n >= 3;
    inn.style.width = (side ? b.height : b.width) + 'px'; inn.style.height = (side ? b.width : b.height) + 'px'; inn.style.transform = `translate(-50%,-50%) rotate(${rot[n]}deg)`; });
}
window.addEventListener('resize', () => { if (G) fitPads(); });
function pad(p) { return document.querySelector('.pad.p' + p); }
function setScore(p) { pad(p).querySelector('.sc').textContent = G.score[p]; }
function flash(p, cls, msg, ms) { const el = pad(p); el.classList.remove('win', 'lose'); el.classList.add(cls); el.querySelector('.msg').textContent = msg; later(() => { el.classList.remove('win', 'lose'); el.querySelector('.msg').textContent = ''; }, ms || 1200); }

function startGame() {
  clearTimers(); paused = false;
  const ids = enabled.length ? enabled : MODES.map(m => m.id);
  G = { players, diff, target, queue: ids.slice(), score: [0, 0, 0, 0, 0], mi: -1, evt: 0, events: 0, state: 'idle', stim: null, locked: new Set(), times: [], mistakes: 0, missed: 0, order: randomOrder ? shuf(ids) : ids.slice() };
  $('menu').classList.add('hidden'); $('modes').classList.add('hidden'); $('endOv').classList.add('hidden'); $('pauseOv').classList.add('hidden'); $('game').classList.remove('hidden');
  $('pause').style.display = 'block'; $$('.pad').forEach(el => { el.classList.remove('win', 'lose'); el.querySelector('.sc').textContent = '0'; el.querySelector('.msg').textContent = ''; });
  layoutPads(); $('stats').textContent = ''; nextMode();
}
function curMode() { return MODES.find(m => m.id === G.order[G.mi % G.order.length]); }
function nextMode() {
  G.mi++; G.evt = 0; const m = curMode(); if (m.n != null) m.n = -1; G.state = 'intro';
  const html = `<div class="txt">${m.hint}</div>`;
  show({ html, two: true }); $('arena').style.background = '#0e1424'; $('hT').textContent = $('hB').textContent = m.fa;
  later(nextStim, 2300);
}
function show(s) {
  const box = $('stimBox'); $('arena').style.background = s.bg || '#0e1424';
  box.innerHTML = s.two ? `<div class="half r"><div class="stim">${s.html}</div></div><div class="half"><div class="stim">${s.html}</div></div>` : `<div class="one"><div class="stim">${s.html}</div></div>`;
}
function nextStim() {
  if (!G || paused) return; const m = curMode(); G.state = 'gap'; G.stim = null; G.locked = new Set();
  const noGap = G.lastNoGap; if (!noGap) { show({ html: '' }); }
  later(showStim, noGap ? 0 : ri(700, 1800 - G.diff * 200));
}
function showStim() {
  if (!G || paused) return; const m = curMode(), s = m.next(G.diff); s.t0 = performance.now(); s.claimed = false; G.stim = s; G.state = 'show'; G.lastNoGap = !!s.noGap; G.locked = new Set(); show(s); sShow();
  later(expire, s.dur || T_SHOW[G.diff]);
}
function expire() {
  if (!G || G.state !== 'show') return; const s = G.stim;
  if (s.correct && !s.claimed) { G.missed++; G.evt++; G.events++; }
  after(0);
}
function after(delay) { G.state = 'result'; updateStats(); if (checkEnd()) return; later(() => { if (G.evt >= EVENTS_PER_MODE) nextMode(); else nextStim(); }, delay); }
function tap(p) {
  if (!G || paused || p > G.players) return;
  if (G.state === 'gap') { G.score[p]--; setScore(p); G.mistakes++; flash(p, 'lose', 'زود زدی!', 1100); sBad(); clearTimers(); G.state = 'result'; later(nextStim, 1200); updateStats(); return; }
  if (G.state !== 'show' || G.locked.has(p)) return; const s = G.stim;
  if (s.correct && !s.claimed) {
    s.claimed = true; clearTimers(); G.score[p]++; setScore(p); G.times.push(Math.round(performance.now() - s.t0)); G.evt++; G.events++; sOk();
    flash(p, 'win', rnd(['عالی بود!', 'آفرین!', 'سریع!', 'نابغه‌ای!', 'فوق‌العاده!', 'بله!']), 1300); for (let q = 1; q <= G.players; q++) if (q !== p) pad(q).classList.add('dim'); later(() => $$('.pad').forEach(e => e.classList.remove('dim')), 1300);
    after(1500);
  } else if (!s.correct) {
    clearTimers(); G.score[p]--; setScore(p); G.mistakes++; sBad(); flash(p, 'lose', rnd(['اشتباه!', 'ای وای!', 'نه!', 'دقت کن!']), 1300); after(1500);
  }
}
function updateStats() { if (G.players !== 1) { $('stats').textContent = ''; return; } const avg = G.times.length ? Math.round(G.times.reduce((a, b) => a + b, 0) / G.times.length) : 0; $('stats').textContent = `reaction avg: ${avg}ms · mistakes: ${G.mistakes} · missed: ${G.missed} · ${G.events}/${SOLO_EVENTS}`; }
function checkEnd() {
  if (G.players === 1) { if (G.events >= SOLO_EVENTS) { endGame(); return true; } return false; }
  for (let p = 1; p <= G.players; p++) if (G.score[p] >= G.target) { endGame(); return true; } return false;
}
function endGame() {
  G.state = 'over'; clearTimers(); $('pause').style.display = 'none';
  later(() => {
    if (G.players === 1) {
      const sum = G.times.reduce((a, b) => a + b, 0), final = sum + G.mistakes * 1000 + G.missed * 500, avg = G.times.length ? Math.round(sum / G.times.length) : 0, key = 'rf-best-' + G.diff, best = ld(key, 0); let note = '';
      if (!best || final < best) { localStorage.setItem(key, final); note = '\n🏆 رکورد جدید!'; } else note = '\nبهترین: ' + fa(best) + ' میلی‌ثانیه';
      $('eT').textContent = 'تمرین تمام شد'; $('eP').textContent = `میانگین واکنش: ${fa(avg)} میلی‌ثانیه\nاشتباه‌ها: ${fa(G.mistakes)}  ·  از دست رفته: ${fa(G.missed)}\nامتیاز نهایی (کمتر بهتر): ${fa(final)}` + note;
    } else {
      let win = 1; for (let p = 2; p <= G.players; p++) if (G.score[p] > G.score[win]) win = p;
      $('eT').textContent = '🏆 بازیکن ' + fa(win) + ' برنده شد!'; $('eP').textContent = Array.from({ length: G.players }, (_, i) => 'بازیکن ' + fa(i + 1) + ': ' + fa(G.score[i + 1])).join('\n');
    }
    $('endOv').classList.remove('hidden'); beep(660, .3, 'triangle'); setTimeout(() => beep(990, .4, 'triangle'), 200);
  }, 900);
}
function toMenu() { clearTimers(); G = null; $('game').classList.add('hidden'); $('pause').style.display = 'none'; ['pauseOv', 'endOv', 'modes'].forEach(i => $(i).classList.add('hidden')); $('menu').classList.remove('hidden'); refreshMenu(); }

$$('.pad').forEach(el => el.addEventListener('pointerdown', e => { e.preventDefault(); tap(+el.dataset.p); }));
document.addEventListener('keydown', e => { if (e.key >= '1' && e.key <= '4') tap(+e.key); });
$('bStart').onclick = startGame; $('eAgain').onclick = startGame; $('eMenu').onclick = toMenu; $('pMenu').onclick = toMenu;
$('pause').onclick = () => { if (!G || G.state === 'over') return; paused = true; clearTimers(); $('pauseOv').classList.remove('hidden'); };
$('pResume').onclick = () => { $('pauseOv').classList.add('hidden'); paused = false; G.state = 'result'; later(nextStim, 700); };
$('pSound').onclick = () => { muted = !muted; localStorage.setItem('rf-muted', muted ? '1' : '0'); $('pSound').textContent = 'صدا: ' + (muted ? 'خاموش' : 'روشن'); }; $('pSound').textContent = 'صدا: ' + (muted ? 'خاموش' : 'روشن');
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.state !== 'over' && !paused) $('pause').onclick(); });
refreshMenu();
window.__rf = { start: (p, d, t) => { players = p; diff = d; if (t) target = t; startGame(); }, tap, st: () => G && ({ state: G.state, score: G.score.slice(), stim: G.stim && { correct: G.stim.correct }, mode: curMode().id, evt: G.evt }), force: (id) => { G.order = [id]; G.mi = 0; nextMode(); }, modes: MODES, T_SHOW, setTimeScale: 1 };
})();
</script>
