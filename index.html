<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#173d34">
<title>Jokers &amp; Chips – a poker roguelike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#1f4f43;--ink:#0a1316;--panel:#26363a;--panel2:#1a272b;--chip:#2a8de8;--mult:#e8483c;
  --gold:#f2b134;--cream:#f4ecd8;--txt:#eaf3ef;--muted:#92aca5;--green:#3fae6a;
  --cw:84px;--jw:76px;
  font-family:'Pixelify Sans','Courier New',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1512;color:var(--txt)}
body{font-size:15px;--b0:#173d34;--b1:#2c6a58;--b2:#0f2b26;--b3:#255a4a}
body.ph-shop{--b0:#3a1519;--b1:#7a2630;--b2:#26090d;--b3:#5b1c24}
body.ph-blinds{--b0:#15252d;--b1:#2c5066;--b2:#0d1920;--b3:#233f50}
body.ph-menu{--b0:#241a38;--b1:#4a2f6e;--b2:#150f24;--b3:#37245a}
button{font-family:inherit}
#bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(60% 50% at 20% 30%,var(--b1) 0,transparent 70%),
  radial-gradient(55% 60% at 80% 70%,var(--b2) 0,transparent 70%),
  radial-gradient(50% 50% at 60% 20%,var(--b3) 0,transparent 70%),var(--b0);
  background-size:150% 150%;animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{from{background-position:0 0,100% 100%,50% 0}to{background-position:100% 60%,0 30%,20% 100%}}
#crt{position:fixed;inset:0;z-index:90;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px),
  radial-gradient(120% 100% at 50% 50%,transparent 60%,rgba(0,0,0,.55) 100%)}
.panel{background:var(--panel);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:8px 10px}
.lbl{color:var(--muted);font-size:.8em}
.btn{font-size:1em;color:#fff;border:0;border-radius:10px;padding:.55em 1em;box-shadow:0 5px 0 rgba(0,0,0,.5);cursor:pointer;font-weight:700;background:#56666a;transition:transform .05s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.btn.blue{background:var(--chip)}.btn.red{background:#e0473c}.btn.gold{background:#e6a22a;color:#2b1c00}.btn.green{background:var(--green)}
.btn.blue,.btn.red,.btn.green{color:#fff}.btn.gold{color:#2b1c00}
.btn.sm{font-size:.85em;padding:.4em .7em}
.btn:disabled{opacity:.4;filter:grayscale(.7);pointer-events:none}
.blue{color:var(--chip)}.red{color:#ff6a5e}.gold{color:var(--gold)}
/* ---- layout ---- */
#game,#menu{position:absolute;inset:0;z-index:2;display:none}
#game.on{display:grid;grid-template-columns:clamp(190px,21vw,250px) 1fr;gap:10px;padding:10px;padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}
#side{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
#blindbox{border-color:var(--bc,#0a1316)}
#sb-name{font-size:1.15em;font-weight:700;margin-bottom:2px}
#sb-target{font-size:1.9em;color:#ff6a5e;font-weight:700;line-height:1.1}
#sb-sub{color:var(--gold);font-size:.9em}
#sc-score{font-size:1.7em;font-weight:700}
#handbox{text-align:center}
#hb-name{min-height:1.4em;font-weight:700}
.cm{display:flex;align-items:center;gap:6px;margin-top:4px}
.cm span{flex:1;font-size:1.5em;font-weight:700;padding:.1em .2em;border-radius:8px;color:#fff;text-align:center;transition:transform .1s}
.cm .chip{background:var(--chip);text-align:right}.cm .mult{background:var(--mult);text-align:left}
.cm i{font-style:normal;color:var(--mult);font-weight:700}
.cm span.bump{transform:scale(1.18)}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#stats div{background:var(--panel2);border-radius:8px;padding:4px 8px;display:flex;justify-content:space-between;align-items:center}
#stats .money{grid-column:1/3;font-size:1.5em;color:var(--gold);justify-content:center;font-weight:700}
#tags{display:flex;gap:4px;flex-wrap:wrap;min-height:0}
#tags span{background:var(--panel2);border-radius:8px;padding:2px 6px;font-size:1.1em}
#sidebtns{display:flex;gap:8px}#sidebtns .btn{flex:1}
#main{display:grid;grid-template-rows:auto auto 1fr;gap:8px;min-width:0;min-height:0}
#toprow{display:flex;gap:10px}
.zone{background:rgba(0,0,0,.28);border-radius:14px;padding:6px 8px;min-width:0}
#jwrap{flex:1}#cwrap{flex:0 0 auto}
.zl{color:var(--muted);font-size:.8em;margin-bottom:3px}
#jokers,#cons{display:flex;gap:6px;min-height:calc(var(--jw)*1.34)}
#detail{min-height:54px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.92em;line-height:1.25}
#detail b{font-size:1.05em}
#detail .grow{flex:1;min-width:150px}
#stage{display:flex;flex-direction:column;min-height:0;gap:8px}
#stage.play{justify-content:flex-end}
#stage.scroll{overflow:auto}
/* ---- cards ---- */
.card{position:relative;flex:0 0 auto;width:var(--cw);height:calc(var(--cw)*1.4);margin-left:calc(var(--cw)*-.2);
  background:linear-gradient(#fbf5e4,#eadfc0);border:2px solid #17120c;border-radius:calc(var(--cw)*.09);
  box-shadow:0 3px 0 rgba(0,0,0,.45);color:var(--sc);font-size:calc(var(--cw)*.3);cursor:pointer;transition:transform .14s,filter .14s}
.card:first-child{margin-left:0}
.card .r,.card .r2{position:absolute;font-weight:700;line-height:1}
.card .r{left:.16em;top:.05em}.card .r2{right:.16em;bottom:.05em;transform:rotate(180deg)}
.card .s{position:absolute;left:.2em;top:1.05em;font-size:.72em;line-height:1}
.card .big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:2.2em;line-height:1}
.card .big small{font-size:.45em}
.card .tg{position:absolute;left:50%;bottom:.1em;transform:translateX(-50%);font-size:.55em;font-weight:700;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:0 .3em}
.card.bonus{background:linear-gradient(#e3efff,#a9c8f5)}
.card.mult{background:linear-gradient(#ffe5e1,#f4aaa2)}
.card.sel{transform:translateY(calc(var(--cw)*-.3))}
.card.hit{transform:translateY(calc(var(--cw)*-.4)) scale(1.1);z-index:5}
.card.deb{filter:grayscale(1) brightness(.62)}
.card.deb::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ff3b30;font-size:2.4em}
.card.deal{animation:deal .38s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
@keyframes deal{from{opacity:0;transform:translate(35vw,-18vh) rotate(18deg) scale(.7)}to{opacity:1;transform:none}}
#played{display:flex;justify-content:center;min-height:calc(var(--cw)*1.45);gap:0}
#played .card{margin-left:calc(var(--cw)*.06);transform:translateY(-6px)}
#played .card:first-child{margin-left:0}
#played .card.hit{transform:translateY(-24px) scale(1.12);z-index:5}
#hand{display:flex;justify-content:center;padding-top:calc(var(--cw)*.35);min-height:calc(var(--cw)*1.8)}
#controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
#controls .btn{min-width:6.2em}
#deckcount{color:var(--muted);font-size:.85em;min-width:4em;text-align:center}
/* ---- jokers ---- */
.jc{position:relative;flex:0 0 auto;width:var(--jw);height:calc(var(--jw)*1.34);border-radius:calc(var(--jw)*.1);background:linear-gradient(#2d4c63,#1c3140);
  border:3px solid #7aa7c7;box-shadow:0 4px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px;cursor:pointer;
  font-size:calc(var(--jw)*.16);text-align:center;transition:transform .14s}
.jc.r1{border-color:#59c07f;background:linear-gradient(#244d3a,#183326)}
.jc.r2{border-color:#ff6a5e;background:linear-gradient(#5a2530,#3a151d)}
.jc .jn{line-height:1.05;font-weight:700;min-height:2.1em;display:flex;align-items:center}
.jc .jg{font-size:3.2em;line-height:1}
.jc .je{font-size:.85em;background:rgba(0,0,0,.55);border-radius:5px;padding:0 .3em}
.jc.empty{border:3px dashed rgba(255,255,255,.18);background:transparent;box-shadow:none;cursor:default}
.jc.sel{transform:translateY(-8px);box-shadow:0 8px 0 rgba(0,0,0,.45),0 0 0 3px var(--gold)}
.jc.hit{transform:translateY(-12px) scale(1.12);z-index:5}
.jc.ed-foil{box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 0 14px #6cc7ff}
.jc.ed-holo{box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 0 14px #ff6a8a}
.jc.ed-poly{animation:poly 3s linear infinite}
.jc.ed-neg{filter:invert(1) hue-rotate(180deg)}
@keyframes poly{to{filter:hue-rotate(360deg)}}
.cc{width:var(--jw);height:calc(var(--jw)*1.34);border-radius:calc(var(--jw)*.1);border:3px solid #b98bff;background:linear-gradient(#3a2a5e,#241a3e);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px;font-size:calc(var(--jw)*.16);text-align:center;cursor:pointer;flex:0 0 auto;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.cc.planet{border-color:#5fd0ff;background:linear-gradient(#1c4660,#12293a)}
.cc .jn{font-weight:700;line-height:1.05;min-height:2.1em;display:flex;align-items:center}.cc .jg{font-size:3em;line-height:1}
.cc.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--gold)}
.cc.empty{border:3px dashed rgba(255,255,255,.18);background:transparent;box-shadow:none;cursor:default}
/* ---- blinds ---- */
#blindrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start;padding:4px}
.bcard{background:var(--panel);border:4px solid var(--ink);border-top:12px solid var(--bc);border-radius:14px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0;box-shadow:0 5px 0 var(--ink)}
.bcard.cur{transform:translateY(-8px);box-shadow:0 12px 0 var(--ink),0 0 0 3px var(--gold)}
.bcard.done,.bcard.skipped{opacity:.55}.bcard:not(.cur):not(.done):not(.skipped){opacity:.8}
.bhead{font-weight:700;font-size:1.15em}
.bchip{width:46px;height:46px;border-radius:50%;background:var(--bc);box-shadow:inset 0 0 0 5px rgba(255,255,255,.4),inset 0 0 0 11px var(--bc),0 3px 0 rgba(0,0,0,.4)}
.bt b{display:block;font-size:1.6em;color:#ff6a5e}
.br{color:var(--gold)}.bd{font-size:.85em;color:#ffc9c3;line-height:1.2}
.bb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btag{font-size:.8em;color:var(--muted)}
.bs{color:var(--muted)}
/* ---- shop ---- */
#shop{display:flex;flex-direction:column;gap:10px}
.shoprow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.shopbar{display:flex;gap:10px;flex-wrap:wrap}
.slot{--jw:var(--sw,76px);width:calc(var(--sw,76px)*1.25);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.78em;text-align:center;line-height:1.2}
.slot .jc,.slot .cc{cursor:default}
.slot .cap{color:#dfeae6;min-height:3.6em}
.slot .btn{width:100%;padding:.35em .2em}
.slot.gone{visibility:hidden}
.rowlbl{width:100%;color:var(--muted);font-size:.85em}
/* ---- overlay ---- */
#overlay{position:fixed;inset:0;z-index:60;background:rgba(4,9,8,.78);display:none;align-items:center;justify-content:center;padding:12px}
#overlay.on{display:flex}
.modal{background:var(--panel);border:4px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);max-width:min(94vw,680px);max-height:92vh;overflow:auto;padding:14px 16px;width:100%}
.modal h2{margin:0 0 8px;font-size:1.5em}
.modal .row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.12)}
.modal .btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.hrow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.12);align-items:center}
.hrow .chip{color:var(--chip)}.hrow .mult{color:#ff6a5e}
.deckgrid{display:grid;grid-template-columns:auto repeat(13,1fr);gap:2px;font-size:.78em;text-align:center}
.deckgrid b{color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.cash{background:#3a2a10;border-color:#150e03}
.cash .row b{color:var(--gold)}
/* ---- popups ---- */
.pop{position:fixed;z-index:80;pointer-events:none;font-weight:700;padding:.05em .45em;border-radius:7px;color:#fff;white-space:nowrap;animation:pop 1s ease-out forwards;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.pop.c{background:var(--chip)}.pop.m{background:var(--mult)}.pop.x{background:#d6331c;font-size:1.15em}.pop.g{background:var(--gold);color:#2b1c00}.pop.bad{background:#555}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-70%) scale(.6)}15%{opacity:1;transform:translate(-50%,-120%) scale(1.15)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-230%)}}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:95;background:#000c;border:2px solid var(--gold);padding:.4em .9em;border-radius:10px;display:none;max-width:92vw;text-align:center}
/* ---- menu ---- */
#menu.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;overflow:auto}
#title{font-size:clamp(2.2rem,9vw,4.6rem);font-weight:700;line-height:.95;text-align:center;color:#fff;text-shadow:3px 3px 0 var(--mult),-3px -3px 0 var(--chip),0 8px 0 #000}
#fan{position:relative;height:calc(var(--cw)*1.7);width:min(90vw,520px)}
#fan .card{position:absolute;left:50%;top:10px;margin:0;transform-origin:50% 120%;cursor:default}
#decks{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:760px}
.deckpick{width:128px;background:var(--panel);border:3px solid var(--ink);border-radius:12px;padding:8px;text-align:center;cursor:pointer;font-size:.82em;box-shadow:0 4px 0 var(--ink)}
.deckpick b{display:block;font-size:1.15em;margin-bottom:3px}
.deckpick.on{border-color:var(--gold);transform:translateY(-4px)}
#menustats{color:var(--muted);font-size:.9em;text-align:center}
@media (max-width:760px),(max-aspect-ratio:1/1){
  body{font-size:13px}
  #game.on{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:6px;padding:6px;padding-top:max(6px,env(safe-area-inset-top))}
  #side{display:grid;grid-template-columns:1.3fr 1fr;gap:5px;overflow:visible}
  #side .panel{padding:5px 8px;border-radius:10px}
  #blindbox{grid-column:1;grid-row:1/3}
  #scorebox{grid-column:2;grid-row:1}
  #handbox{grid-column:2;grid-row:2}
  #stats{grid-column:1/3;grid-template-columns:repeat(5,1fr);gap:4px}
  #stats .money{grid-column:auto;font-size:1.2em}
  #stats div{flex-direction:column;padding:2px 4px;font-size:.9em}
  #sidebtns{grid-column:1/3}
  #sb-target{font-size:1.5em}#sc-score{font-size:1.3em}.cm span{font-size:1.2em}
  #blindrow{grid-template-columns:1fr;gap:10px}
  .bcard{flex-direction:row;flex-wrap:wrap;justify-content:space-between;text-align:left}
  .bcard.cur{transform:none}
  .bchip{display:none}
  #controls .btn{min-width:5em}
}
@media (max-height:480px){#sidebtns{display:none}}
@media (prefers-reduced-motion:reduce){#bg{animation:none}.card.deal{animation:none}}
.btn:focus-visible,[data-act]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body class="ph-menu">
<div id="bg"></div>

<div id="menu" class="on">
  <div id="title">JOKERS<br>&amp; CHIPS</div>
  <div id="fan"></div>
  <div id="decks"></div>
  <button class="btn gold" data-act="start" style="font-size:1.3em;padding:.6em 2em">Play</button>
  <div id="menustats"></div>
</div>

<div id="game">
  <aside id="side">
    <div id="blindbox" class="panel">
      <div id="sb-name">Choose a blind</div>
      <div class="lbl" id="sb-lbl">Score at least</div>
      <div id="sb-target">–</div>
      <div id="sb-sub"></div>
      <div id="tags"></div>
    </div>
    <div id="scorebox" class="panel"><div class="lbl">Round score</div><div id="sc-score">0</div></div>
    <div id="handbox" class="panel">
      <div id="hb-name">&nbsp;</div>
      <div class="cm"><span id="hb-chips" class="chip">0</span><i>×</i><span id="hb-mult" class="mult">0</span></div>
    </div>
    <div id="stats" class="panel">
      <div><span class="lbl">Hands</span><b id="st-hands" class="blue">4</b></div>
      <div><span class="lbl">Discards</span><b id="st-disc" class="red">3</b></div>
      <div class="money"><b id="st-money">$4</b></div>
      <div><span class="lbl">Ante</span><b id="st-ante">1/8</b></div>
      <div><span class="lbl">Round</span><b id="st-round">0</b></div>
    </div>
    <div id="sidebtns" class="panel"><button class="btn sm" data-act="info">Run info</button><button class="btn sm" data-act="opts">Options</button></div>
  </aside>
  <section id="main">
    <div id="toprow">
      <div id="jwrap" class="zone"><div class="zl">Jokers <span id="jcount"></span></div><div id="jokers"></div></div>
      <div id="cwrap" class="zone"><div class="zl">Consumables <span id="ccount"></span></div><div id="cons"></div></div>
    </div>
    <div id="detail" class="panel"></div>
    <div id="stage"></div>
  </section>
</div>

<div id="overlay"></div>
<div id="toast"></div>
<div id="crt"></div>

<script>
(function(){
'use strict';
/*LOGIC-START*/
/* ====================================================================
   GAME LOGIC (no DOM access in this block)
   ==================================================================== */
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const SUIT={S:{s:'♠',n:'Spades',c:'#2d3f7a'},H:{s:'♥',n:'Hearts',c:'#e23b34'},C:{s:'♣',n:'Clubs',c:'#2c7d4f'},D:{s:'♦',n:'Diamonds',c:'#ea8a1c'}};
const SUIT_ORDER=['S','H','C','D'];
const rankLabel=r=>r<=10?String(r):'JQKA'[r-11];
const chipVal=r=>r===14?11:Math.min(r,10);
const isFace=r=>r>=11&&r<=13;
let UID=1;
const mk=(rank,suit,enh)=>({id:UID++,rank,suit,enh:enh||null,sel:false});

const HANDS={
 'High Card':{c:5,m:1,lc:10,lm:1,planet:'Pluto'},
 'Pair':{c:10,m:2,lc:15,lm:1,planet:'Mercury'},
 'Two Pair':{c:20,m:2,lc:20,lm:1,planet:'Uranus'},
 'Three of a Kind':{c:30,m:3,lc:20,lm:2,planet:'Venus'},
 'Straight':{c:30,m:4,lc:30,lm:3,planet:'Saturn'},
 'Flush':{c:35,m:4,lc:15,lm:2,planet:'Jupiter'},
 'Full House':{c:40,m:4,lc:25,lm:2,planet:'Earth'},
 'Four of a Kind':{c:60,m:7,lc:30,lm:3,planet:'Mars'},
 'Straight Flush':{c:100,m:8,lc:40,lm:4,planet:'Neptune'}
};
const HAND_ORDER=['Straight Flush','Four of a Kind','Full House','Flush','Straight','Three of a Kind','Two Pair','Pair','High Card'];
const ED={foil:{n:'Foil',d:'+50 Chips',cost:2},holo:{n:'Holographic',d:'+10 Mult',cost:3},poly:{n:'Polychrome',d:'×1.5 Mult',cost:5},neg:{n:'Negative',d:'+1 Joker slot',cost:5}};

function evalHand(cards){
  const n=cards.length,by={};
  cards.forEach(c=>{(by[c.rank]=by[c.rank]||[]).push(c)});
  const groups=Object.values(by).sort((a,b)=>b.length-a.length||b[0].rank-a[0].rank);
  const k=groups.map(g=>g.length);
  const flush=n===5&&cards.every(c=>c.suit===cards[0].suit);
  let straight=false;
  if(n===5&&groups.length===5){
    const rs=cards.map(c=>c.rank).sort((a,b)=>a-b);
    straight=(rs[4]-rs[0]===4)||rs.join()==='2,3,4,5,14';
  }
  const has={pair:k[0]>=2,two:k.filter(v=>v>=2).length>=2,three:k[0]>=3,four:k[0]>=4,flush,straight};
  let name,sc;
  if(straight&&flush){name='Straight Flush';sc=cards}
  else if(k[0]===4){name='Four of a Kind';sc=groups[0]}
  else if(k[0]===3&&k[1]===2){name='Full House';sc=cards}
  else if(flush){name='Flush';sc=cards}
  else if(straight){name='Straight';sc=cards}
  else if(k[0]===3){name='Three of a Kind';sc=groups[0]}
  else if(k[0]===2&&k[1]===2){name='Two Pair';sc=groups[0].concat(groups[1])}
  else if(k[0]===2){name='Pair';sc=groups[0]}
  else{name='High Card';sc=[cards.reduce((a,b)=>b.rank>a.rank?b:a)]}
  return {name,scoring:cards.filter(c=>sc.includes(c)),has};
}

  for(const j of G.jokers){const s=j.def.stat;if(s){h+=s.h||0;d+=s.d||0;hs+=s.hs||0;if(s.dz)dz=true}}
  if(dz)d=0;
  const boss=b.boss||null;
  if(boss){if(boss.id==='water')d=0;if(boss.id==='needle')h=1;if(boss.id==='manacle')hs-=1}
  h=Math.max(1,h);hs=Math.max(1,hs);
  G.R={blind:b,boss,target:b.target,score:0,handsLeft:h,discardsLeft:d,discardsMax:d,handSize:hs,discardsUsed:0,done:false};
  G.full.forEach(c=>c.sel=false);
  G.draw=shuffle(G.full.slice());G.disc=[];G.hand=[];
  drawCards(hs);

  if(j.id==='brainstorm'){if(i===0)return null;const r=resolveJoker(G,0,depth+1);return r?{j:r.j,copy:true}:null}

function scorePlay(G,played,held,R){
  const hand=evalHand(played);
  const x={G,R,hand,played,held,scoring:null,firstFace:null,handsLeft:R.handsLeft,discardsLeft:R.discardsLeft,debuff:c=>isDeb(G,c)};
  const sc=G.jokers.some(j=>j.id==='splash')?played:hand.scoring;
  x.scoring=played.filter(c=>sc.includes(c));
  x.firstFace=x.scoring.find(c=>isFace(c.rank)&&!x.debuff(c))||null;
  const ev=[];
  const L=G.levels[hand.name];L.plays++;G.stat.hands++;
  let note=null;
  if(R.boss&&R.boss.id==='arm'&&L.l>1){L.l--;note='The Arm lowered the hand level'}
  const act=G.jokers.map((j,i)=>{const r=resolveJoker(G,i);return {i,real:j,t:r?r.j:null,copy:r?r.copy:false}});
  G.jokers.forEach((j,i)=>{if(j.def.pre){const lab=j.def.pre(x,j);if(lab)ev.push({who:{k:'joker',i},eff:{},label:lab})}});
  const hd=HANDS[hand.name];
  let chips=hd.c+hd.lc*(L.l-1),mult=hd.m+hd.lm*(L.l-1);
  if(R.boss&&R.boss.id==='flint'){chips=Math.ceil(chips/2);mult=Math.max(1,Math.ceil(mult/2))}
  const base={c:chips,m:mult,lvl:L.l};
  const push=(who,eff,label,extra)=>{
    if(eff){if(eff.c)chips+=eff.c;if(eff.m)mult+=eff.m;if(eff.x)mult*=eff.x;if(eff.$)G.money+=eff.$}
    ev.push(Object.assign({who,eff:eff||{},label:label||null,chips,mult},extra||{}));
  };
  for(const card of x.scoring){
    const who={k:'card',card};
    if(x.debuff(card)){push(who,null,'Debuffed',{bad:true});continue}
    let reps=1;
    for(const a of act)if(a.t&&a.t.def.retrig)reps+=a.t.def.retrig(x,card,a.t);
    for(let r=0;r<reps;r++){
      if(r>0)push(who,null,'Again!');
      push(who,{c:chipVal(card.rank)+(card.enh==='bonus'?30:0),m:card.enh==='mult'?4:0});
      for(const a of act)if(a.t&&a.t.def.card){const e=a.t.def.card(x,card,a.t,a.copy);if(e)push({k:'joker',i:a.i},e,null,{card})}
    }
  }
  for(const c of held){
    if(x.debuff(c))continue;
    for(const a of act)if(a.t&&a.t.def.held){const e=a.t.def.held(x,c,a.t,a.copy);if(e)push({k:'joker',i:a.i},e,null,{card:c,held:true})}
  }
  for(const a of act){
    const who={k:'joker',i:a.i};
    if(a.real.ed==='foil')push(who,{c:50});
    if(a.real.ed==='holo')push(who,{m:10});
    if(a.t&&a.t.def.main){const e=a.t.def.main(x,a.t,a.copy);if(e)push(who,e)}
    if(a.real.ed==='poly')push(who,{x:1.5});
  }
  if(R.boss&&R.boss.id==='tooth'){G.money-=played.length;note='The Tooth: −$'+played.length}
  G.jokers.forEach(j=>{if(j.def.post)j.def.post(x,j)});
  const total=Math.floor(chips*mult+1e-9);
  if(total>G.stat.best)G.stat.best=total;
  return {hand,scoring:x.scoring,events:ev,total,chips,mult,base,note};
}
function levelUp(hn,n){G.levels[hn].l+=(n||1)}
function discardCards(sel){
  const R=G.R;R.discardsLeft--;R.discardsUsed++;
  G.hand=G.hand.filter(c=>!sel.includes(c));G.disc.push(...sel);
  const gains=[];
  const x={G,R,cards:sel};
  G.jokers.forEach((j,i)=>{if(j.def.onDiscard){const r=j.def.onDiscard(x,j);if(r&&r.$){G.money+=r.$;gains.push({i,$:r.$})}}});
  return gains;
}
function roundLines(){
  const R=G.R,b=R.blind,lines=[];
  const add=(l,a)=>lines.push([l,a]);
  add(`${b.name} defeated`,b.reward);
  if(R.handsLeft>0)add(`${R.handsLeft} unused hand${R.handsLeft>1?'s':''} ($1 each)`,R.handsLeft);
  for(const j of G.jokers){if(j.def.end){const r=j.def.end(G,j,R);if(r&&r.$)add(j.def.name,r.$)}}
  const per=1+G.jokers.filter(j=>j.def.interest).length;
  const ib=Math.floor(Math.min(Math.max(G.money,0),G.interestCap)/5)*per;
  if(ib)add(`Interest ($${per} per $5 held)`,ib);
  if(b.boss){const inv=G.tags.filter(t=>t==='investment').length;if(inv)add(`Investment Tag ×${inv}`,25*inv)}
  return {lines,total:lines.reduce((a,l)=>a+l[1],0)};
}
function finishRound(total){
  const R=G.R,b=R.blind;
  G.money+=total;
  for(const j of G.jokers)if(j.def.endState)j.def.endState(G,j);
  if(b.boss)G.tags=G.tags.filter(t=>t!=='investment');
  const victory=!!b.boss&&G.ante===8&&!G.won;
  if(victory)G.won=true;
  advanceBlind('done');
  R.done=true;
  return victory;
}
function advanceBlind(res){
  G.bres[G.bi]=res;G.bi++;
  if(G.bi>=3){G.ante++;G.bi=0;genAnte()}
}
function skipBlind(){
  const t=G.antetags[G.bi];G.tags.push(t);G.skipped++;advanceBlind('skipped');return t;
}
/* ---------- shop ---------- */
function genItem(free){
  const r=Math.random();let it;
  if(r<.72){const d=randomJokerDef(),ed=rollEdition();it={type:'joker',def:d,ed,cost:price(d.cost,ed)}}
  else if(r<.86){it={type:'planet',def:pick(PLANETS),cost:price(3)}}
  else{it={type:'tarot',def:pick(TAROTS),cost:price(3)}}
  if(free){it.cost=0;it.free=true}
  it.uid=UID++;return it;
}
function genPack(){
  let t=rnd(PACKS.reduce((a,p)=>a+p.w,0)),d=PACKS[0];
  for(const p of PACKS){if(t<p.w){d=p;break}t-=p.w}
  return {uid:UID++,def:d,cost:price(d.cost)};
}
function randomVoucher(){const pool=VOUCHERS.filter(v=>!G.vouchers.includes(v.id));return pool.length?pick(pool):null}
function enterShop(){
  const notes=[];
  if(G.tags.includes('economy')){const g=Math.min(40,Math.max(0,G.money));G.money+=g;notes.push(`Economy Tag: +$${g}`)}
  if(G.tags.includes('speed')){const g=5*G.skipped;G.money+=g;notes.push(`Speed Tag: +$${g}`)}
  const coupon=G.tags.includes('coupon');
  G.tags=G.tags.filter(t=>!['economy','speed','coupon'].includes(t));
  const n=2+(G.vouchers.includes('overstock')?1:0),items=[];
  for(let i=0;i<n;i++)items.push(genItem(coupon));
  if(G.voucherAnte!==G.ante){G.voucherAnte=G.ante;G.voucherOffer=randomVoucher()}
  G.shop={items,packs:[genPack(),genPack()],reroll:5,voucher:G.voucherOffer};
  G.phase='shop';return notes;
}
function rerollShop(){
  if(G.money<G.shop.reroll)return {ok:false,msg:'Not enough money'};
  G.money-=G.shop.reroll;G.shop.reroll++;
  G.shop.items=G.shop.items.map(()=>genItem(false));
  return {ok:true};
}
function buyItem(it){
  if(G.money<it.cost)return {ok:false,msg:'Not enough money'};
  if(it.type==='joker'){
    if(G.jokers.length>=jslotsTotal()+(it.ed==='neg'?1:0))return {ok:false,msg:'No free Joker slot'};
    G.money-=it.cost;G.jokers.push(mkJoker(it.def,it.ed));
  }else{
    if(G.cons.length>=G.cslots)return {ok:false,msg:'Consumable slots are full'};
    G.money-=it.cost;G.cons.push(mkCons(it.type,it.def));
  }
  G.shop.items=G.shop.items.filter(i=>i!==it);return {ok:true};
}
function buyVoucher(){
  const v=G.shop.voucher;if(!v)return {ok:false};
  if(G.money<10)return {ok:false,msg:'Not enough money'};
  G.money-=10;G.vouchers.push(v.id);if(v.on)v.on(G);
  G.shop.voucher=null;G.voucherOffer=null;return {ok:true};
}
function packChoices(p){
  const id=p.def.id,out=[];
  if(id==='celestial'){shuffle(PLANETS.slice()).slice(0,3).forEach(d=>out.push({type:'planet',def:d}))}
  else if(id==='arcana'){shuffle(TAROTS.slice()).slice(0,3).forEach(d=>out.push({type:'tarot',def:d}))}
  else if(id==='buffoon'){const used=new Set();for(let i=0;i<2;i++){let d,t=0;do{d=randomJokerDef();t++}while(used.has(d.id)&&t<20);used.add(d.id);out.push({type:'joker',def:d,ed:rollEdition()})}}
  else{for(let i=0;i<3;i++){const r=Math.random();out.push({type:'card',card:mk(2+rnd(13),pick(SUIT_ORDER),r<.2?'bonus':r<.4?'mult':null)})}}
  return out;
}
function takeChoice(ch){
  if(ch.type==='planet'){levelUp(ch.def.hand);G.jokers.forEach(j=>{if(j.id==='constellation')j.s.x=+(j.s.x+.1).toFixed(2)});return {ok:true,msg:`${ch.def.hand} leveled up!`}}
  if(ch.type==='tarot'){if(G.cons.length>=G.cslots)return {ok:false,msg:'Consumable slots are full'};G.cons.push(mkCons('tarot',ch.def));return {ok:true}}
  if(ch.type==='joker'){if(G.jokers.length>=jslotsTotal()+(ch.ed==='neg'?1:0))return {ok:false,msg:'No free Joker slot'};G.jokers.push(mkJoker(ch.def,ch.ed));return {ok:true}}
  G.full.push(ch.card);return {ok:true,msg:'Card added to your deck'};
}
function sellJoker(j){G.money+=sellVal(j);G.jokers=G.jokers.filter(x=>x!==j)}
function sellCons(c){G.money+=1;G.cons=G.cons.filter(x=>x!==c)}
function useCons(c){
  const d=c.def;
  if(c.type==='planet'){
    levelUp(d.hand);G.jokers.forEach(j=>{if(j.id==='constellation')j.s.x=+(j.s.x+.1).toFixed(2)});
    G.cons=G.cons.filter(x=>x!==c);return {ok:true,msg:`${d.hand} leveled up!`};
  }
  const inRound=G.phase==='play'&&G.R&&!G.R.done;
  const sel=inRound?G.hand.filter(h=>h.sel):[];
  const [mn,mx]=d.need;
  if(mn>0){
    if(!inRound)return {ok:false,msg:'Use this during a round'};
    if(sel.length<mn||sel.length>mx)return {ok:false,msg:`Select ${mn===mx?mn:mn+'–'+mx} card${mx>1?'s':''} first`};
  }
  const r=d.use(G,sel);
  if(!r.ok)return r;
  G.cons=G.cons.filter(x=>x!==c);
  sel.forEach(s=>s.sel=false);
  return r;
}
function gameSummary(){return {ante:G.ante,round:G.round,best:G.stat.best,hands:G.stat.hands}}

/* ---- sound ---- */
let AC=null;
function tone(f,d,type,v,when){
  if(!OPT.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
const sfx={
  sel:n=>tone(300+n*60,.06),click:()=>tone(520,.05),
  chip:i=>tone(400+Math.min(i,12)*45,.09),mult:i=>tone(260+Math.min(i,12)*35,.1,'sawtooth',.04),
  coin:()=>{tone(880,.08);tone(1320,.12,'square',.05,.07)},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'square',.06,i*.11)),
  lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.25,'sawtooth',.06,i*.18))
};

  const nw=new Set(newIds||[]);let i=0;
  G.hand.forEach(c=>{const e=cardEl(c);if(nw.has(c.id)){e.classList.add('deal');e.style.setProperty('--i',i++)}h.appendChild(e)});
  const dc=$('#deckcount');if(dc)dc.textContent=`${G.draw.length}/${G.full.length}`;
}
function setBtns(){
  const R=G.R,p=$('#bPlay'),d=$('#bDisc');if(!p||!R)return;
  const n=G.hand.filter(c=>c.sel).length;
  p.disabled=busy||!n||R.handsLeft<1;d.disabled=busy||!n||R.discardsLeft<1;
  $('#bSort').disabled=busy;
  const dc=$('#deckcount');if(dc)dc.textContent=`${G.draw.length}/${G.full.length}`;
}
function previewSel(){
  const sel=G.hand.filter(c=>c.sel);
  if(!sel.length){setHB('',0,0,0);return}
  const h=evalHand(sel),L=G.levels[h.name],hd=HANDS[h.name];
  setHB(h.name,L.l,hd.c+hd.lc*(L.l-1),hd.m+hd.lm*(L.l-1));
}
function renderShop(){
  const S=G.shop,st=$('#stage');
  const slot=(it)=>{
    const prev=it.type==='joker'?previewJoker(it.def,it.ed):consEl(mkCons(it.type,it.def));
    const cap=it.type==='joker'?`${jokerDesc({def:it.def,ed:it.ed,s:it.def.init?it.def.init():{}})}`:esc(it.def.d);
    return `<div class="slot">${prev.outerHTML}<div class="cap">${cap}</div><button class="btn gold" data-act="buy" data-id="${it.uid}" ${G.money<it.cost?'disabled':''}>${it.cost?'Buy $'+it.cost:'Free'}</button></div>`;
  };
  const pk=p=>`<div class="slot"><div class="cc" style="border-color:#f2b134"><div class="jn">${p.def.n}</div><div class="jg">${p.def.g}</div><div class="je" style="visibility:hidden">–</div></div><div class="cap">${p.def.d}</div><button class="btn gold" data-act="pack" data-id="${p.uid}" ${G.money<p.cost?'disabled':''}>Open $${p.cost}</button></div>`;
  const v=S.voucher?`<div class="slot"><div class="cc" style="border-color:#7ee0a0;background:linear-gradient(#1f4d37,#143324)"><div class="jn">${S.voucher.n}</div><div class="jg">${S.voucher.g}</div><div class="je" style="visibility:hidden">–</div></div><div class="cap">${S.voucher.d}</div><button class="btn green" data-act="buyv" ${G.money<10?'disabled':''}>Buy $10</button></div>`:'';
  st.innerHTML=`<div id="shop"><div class="shopbar"><button class="btn green" data-act="next">Next round</button>
    <button class="btn red" data-act="reroll" ${G.money<S.reroll?'disabled':''}>Reroll $${S.reroll}</button></div>
    <div class="shoprow"><div class="rowlbl">Cards</div>${S.items.map(slot).join('')||'<div class="lbl">Sold out – reroll for more.</div>'}</div>
    <div class="shoprow"><div class="rowlbl">Packs and voucher</div>${S.packs.map(pk).join('')}${v}</div></div>`;
}

/* ---- overlay ---- */
function overlay(html){const o=$('#overlay');o.innerHTML=`<div class="modal">${html}</div>`;o.classList.add('on')}
function closeOverlay(){$('#overlay').classList.remove('on');$('#overlay').innerHTML=''}

/* ---- scoring animation ---- */
function anchorFor(e,playedEls){
  if(e.who.k==='joker')return $('#jokers').children[e.who.i];
  if(e.card&&e.held)return $('#hand').querySelector(`[data-id="${e.card.id}"]`);
  return playedEls[e.who.card?e.who.card.id:e.card.id];
}
async function animate(res,playedEls){
  const L=G.levels[res.hand.name];
  setHB(res.hand.name,res.base.lvl,res.base.c,res.base.m);
  await sleep(380);
  let ci=0,mi=0;
  for(const e of res.events){
    const a=anchorFor(e,playedEls),f=e.eff||{};
    const hasFx=f.c||f.m||f.x||f.$||e.label;
    if(!hasFx)continue;
    bump(a);let k=0;
    if(e.label)pop(a,e.label,e.bad?'bad':'g',k++);
    if(f.c){pop(a,'+'+fm(f.c),'c',k++);sfx.chip(ci++)}
    if(f.m){pop(a,'+'+fm(f.m),'m',k++);sfx.mult(mi++)}
    if(f.x){pop(a,'×'+fm(f.x),'x',k++);sfx.mult(mi++)}
    if(f.$){pop(a,'+$'+f.$,'g',k++);sfx.coin()}
    if(e.chips!=null){
      const cb=$('#hb-chips'),mb=$('#hb-mult');
      cb.textContent=fm(e.chips);mb.textContent=fm(e.mult);
      cb.classList.add('bump');mb.classList.add('bump');setTimeout(()=>{cb.classList.remove('bump');mb.classList.remove('bump')},120);
    }
    if(f.$)$('#st-money').textContent='$'+G.money;
    await sleep(e.who.k==='card'&&!e.label?300:360);
  }
  await sleep(250);
}
function countUp(from,to,ms){
  return new Promise(res=>{
    const t0=performance.now(),d=ms*speedMul(),box=$('#sc-score');
    if(d<30){box.textContent=fmt(to);return res()}
    const step=now=>{const p=Math.min(1,(now-t0)/d);box.textContent=fmt(from+(to-from)*p);p<1?requestAnimationFrame(step):res()};
    requestAnimationFrame(step);
  });
}

/* ---- play / discard ---- */
async function doPlay(){
  if(busy||G.phase!=='play')return;
  const R=G.R,sel=G.hand.filter(c=>c.sel);
  if(!sel.length||R.handsLeft<1)return;
  if(R.boss&&R.boss.id==='psychic'&&sel.length!==5){toast('The Psychic: you must play exactly 5 cards');return}
  busy=true;
  G.hand=G.hand.filter(c=>!c.sel);R.handsLeft--;
  const played=$('#played'),playedEls={};
  sel.forEach(c=>{const e=cardEl(c);e.classList.remove('sel');e.dataset.act='';playedEls[c.id]=e;played.appendChild(e)});
  renderHand([]);setBtns();renderSide();
  const res=scorePlay(G,sel,G.hand,R);
  await animate(res,playedEls);
  if(res.note)toast(res.note);
  await countUp(R.score,R.score+res.total,550);
  R.score+=res.total;
  G.jokers=G.jokers.filter(j=>{if(j.melted){toast(j.def.name+' melted away');return false}return true});
  G.disc.push(...sel);played.innerHTML='';
  if(R.boss&&R.boss.id==='hook'&&G.hand.length){
    const out=shuffle(G.hand.slice()).slice(0,2);G.hand=G.hand.filter(c=>!out.includes(c));G.disc.push(...out);toast('The Hook discarded 2 cards');
  }
  setHB('',0,0,0);renderSide();renderJokers();
  if(R.score>=R.target){await sleep(300);endRound();return}
  if(R.handsLeft<1){gameOver();return}
  const got=drawCards(R.handSize-G.hand.length);
  renderHand(got);
  if(!G.hand.length){gameOver();return}
  busy=false;setBtns();renderDetail();
}
function doDiscard(){
  if(busy||G.phase!=='play')return;
  const R=G.R,sel=G.hand.filter(c=>c.sel);
  if(!sel.length||R.discardsLeft<1)return;
  const gains=discardCards(sel);
  sfx.click();
  const got=drawCards(R.handSize-G.hand.length);
  renderHand(got);renderSide();setHB('',0,0,0);renderJokers();setBtns();
  gains.forEach(g=>pop($('#jokers').children[g.i],'+$'+g.$,'g'));
  if(!G.hand.length&&R.handsLeft>0)gameOver();
}

/* ---- round end / game over ---- */
function endRound(){
  busy=true;sfx.win();
  const r=roundLines(),R=G.R;
  overlay(`<div class="cash" style="padding:4px"><h2>${esc(R.blind.name)} cleared!</h2>
    ${r.lines.map(l=>`<div class="row"><span>${esc(l[0])}</span><b>$${l[1]}</b></div>`).join('')}
    <div class="btns"><button class="btn gold" data-act="cashout" data-id="${r.total}" style="font-size:1.2em">Cash out $${r.total}</button></div></div>`);
}
function cashOut(total){
  closeOverlay();
  const victory=finishRound(+total);
  const showShop=()=>{const notes=enterShop();busy=false;setPhase('shop');if(notes.length)toast(notes.join(' · '))};
  if(victory){
    MS.wins++;MS.bestAnte=Math.max(MS.bestAnte,8);store.set('jc_stats',MS);sfx.win();
    overlay(`<h2>You win! 🎉</h2><p>You beat all 8 antes. Keep going in endless mode, or start a fresh run.</p>
      <div class="btns"><button class="btn gold" data-act="goshop">Continue (endless)</button><button class="btn" data-act="menu">Main menu</button></div>`);
  }else showShop();
}
function gameOver(){
  busy=true;sfx.lose();
  const s=gameSummary();
  MS.runs++;MS.bestAnte=Math.max(MS.bestAnte,s.ante);MS.bestHand=Math.max(MS.bestHand,s.best);store.set('jc_stats',MS);
  overlay(`<h2>Game over</h2><div class="row"><span>Ante reached</span><b>${s.ante}</b></div><div class="row"><span>Rounds played</span><b>${s.round}</b></div>
    <div class="row"><span>Hands played</span><b>${s.hands}</b></div><div class="row"><span>Best hand</span><b>${fmt(s.best)}</b></div>
    <div class="row"><span>Needed</span><b>${fmt(G.R.target)} (you scored ${fmt(G.R.score)})</b></div>
    <div class="btns"><button class="btn gold" data-act="again">New run</button><button class="btn" data-act="menu">Main menu</button></div>`);
}

/* ---- info / options ---- */
function infoOverlay(tab){
  let body='';
  if(tab==='deck'){
    const cnt={};G.full.forEach(c=>{cnt[c.suit+c.rank]=(cnt[c.suit+c.rank]||0)+1});
    body=`<div class="deckgrid"><span></span>${[14,13,12,11,10,9,8,7,6,5,4,3,2].map(r=>`<b>${rankLabel(r)}</b>`).join('')}`+
      SUIT_ORDER.map(s=>`<b style="color:${SUIT[s].c==='#2d3f7a'?'#7a9bff':SUIT[s].c}">${SUIT[s].s}</b>`+[14,13,12,11,10,9,8,7,6,5,4,3,2].map(r=>`<span>${cnt[s+r]||'·'}</span>`).join('')).join('')+`</div>
      <p class="lbl">${G.full.length} cards in your deck.</p>`;
  }else{
    body=HAND_ORDER.map(h=>{const L=G.levels[h],d=HANDS[h];return `<div class="hrow"><span>${h} <span class="lbl">lvl.${L.l}</span></span><span class="chip">${d.c+d.lc*(L.l-1)}</span><span class="mult">×${d.m+d.lm*(L.l-1)}</span><span class="lbl">${L.plays}×</span></div>`}).join('');
  }
  overlay(`<h2>Run info</h2><div class="tabs"><button class="btn sm ${tab==='deck'?'':'blue'}" data-act="infotab" data-id="hands">Poker hands</button><button class="btn sm ${tab==='deck'?'blue':''}" data-act="infotab" data-id="deck">Deck</button></div>${body}
    <div class="btns"><button class="btn gold" data-act="closeov">Close</button></div>`);
}
function optsOverlay(){
  overlay(`<h2>Options</h2>
   <div class="row"><span>Scoring speed</span><span>${['normal','fast','instant'].map(s=>`<button class="btn sm ${OPT.speed===s?'blue':''}" data-act="speed" data-id="${s}">${s}</button>`).join(' ')}</span></div>
   <div class="row"><span>Sound</span><button class="btn sm ${OPT.sound?'blue':''}" data-act="sound">${OPT.sound?'On':'Off'}</button></div>
   <div class="btns"><button class="btn red" data-act="menu">Abandon run</button><button class="btn gold" data-act="closeov">Close</button></div>`);
}
function packOverlay(p){
  const ch=packChoices(p);window.__pack={p,ch};
  const html=ch.map((c,i)=>{
    let vis,cap;
    if(c.type==='joker'){vis=previewJoker(c.def,c.ed).outerHTML;cap=jokerDesc({def:c.def,ed:c.ed,s:c.def.init?c.def.init():{}})}
    else if(c.type==='card'){const e=cardEl(c.card);e.dataset.act='';vis=e.outerHTML;cap=c.card.enh?(c.card.enh==='bonus'?'Bonus card: +30 Chips':'Mult card: +4 Mult'):'Plain card'}
    else{vis=consEl(mkCons(c.type,c.def)).outerHTML;cap=esc(c.def.d)}
    return `<div class="slot" style="width:${c.type==='card'?'auto':''}">${vis}<div class="cap">${cap}</div><button class="btn gold" data-act="take" data-id="${i}">Take</button></div>`;
  }).join('');
  overlay(`<h2>${p.def.n}</h2><p class="lbl">${p.def.d}</p><div class="choices" style="--cw:64px">${html}</div><div class="btns"><button class="btn" data-act="skippack">Skip</button></div>`);
}

/* ---- action handlers ---- */
const ACT={
  start(){
    newRun(deckPick);busy=false;$('#menu').classList.remove('on');$('#game').classList.add('on');closeOverlay();
    setPhase('blinds');
  },
  menu(){closeOverlay();$('#game').classList.remove('on');$('#menu').classList.add('on');document.body.className='ph-menu';G=null;renderMenu()},
  again(){closeOverlay();ACT.start()},
  closeov(){closeOverlay()},
  info(){if(G)infoOverlay('hands')},
  infotab(id){infoOverlay(id)},
  opts(){optsOverlay()},
  speed(id){OPT.speed=id;store.set('jc_opt',OPT);optsOverlay()},
  sound(){OPT.sound=!OPT.sound;store.set('jc_opt',OPT);optsOverlay()},
  deck(id){deckPick=id;renderMenu()},
  tag(id){toast(TAGS[id].n+': '+TAGS[id].d)},
  card(id){
    if(busy||G.phase!=='play')return;
    const c=G.hand.find(x=>x.id===+id);if(!c)return;
    const n=G.hand.filter(x=>x.sel).length;
    if(!c.sel&&n>=5){toast('You can select at most 5 cards');return}
    c.sel=!c.sel;sfx.sel(n+(c.sel?1:-1));
    const e=$('#hand').querySelector(`[data-id="${id}"]`);if(e)e.classList.toggle('sel',c.sel);
    previewSel();setBtns();
  },
  play(){doPlay()},disc(){doDiscard()},
  sort(){G.sort=G.sort==='rank'?'suit':'rank';sortHand();renderHand([]);const b=$('#bSort');if(b)b.textContent='Sort: '+(G.sort==='rank'?'Rank':'Suit')},
  selblind(){sfx.click();startRound();busy=false;setPhase('play');setHB('',0,0,0);renderHand(G.hand.map(c=>c.id));
    if(G.R.boss)toast(G.R.boss.n+': '+G.R.boss.d)},
  skipblind(){const t=skipBlind();toast(TAGS[t].n+' gained');sfx.coin();setPhase('blinds')},
  joker(id){selJ=selJ===+id?null:+id;selC=null;renderJokers();renderCons();renderDetail()},
  cons(id){selC=selC===+id?null:+id;selJ=null;renderJokers();renderCons();renderDetail()},
  jleft(){moveJ(-1)},jright(){moveJ(1)},
  jsell(){const j=G.jokers.find(x=>x.uid===selJ);if(!j)return;sellJoker(j);selJ=null;sfx.coin();refreshAll();if(G.phase==='shop')renderShop()},
  csell(){const c=G.cons.find(x=>x.uid===selC);if(!c)return;sellCons(c);selC=null;sfx.coin();refreshAll();if(G.phase==='shop')renderShop()},
  cuse(){
    const c=G.cons.find(x=>x.uid===selC);if(!c||busy)return;
    const r=useCons(c);
    if(!r.ok){toast(r.msg||'Cannot use that now');return}
    selC=null;toast(r.msg||'Used');sfx.coin();
    if(G.phase==='play'){renderHand([]);previewSel();setBtns()}
    refreshAll();if(G.phase==='shop')renderShop();
  },
  buy(id){const it=G.shop.items.find(x=>x.uid===+id);if(!it)return;const r=buyItem(it);if(!r.ok){toast(r.msg);return}sfx.coin();renderShop();refreshAll()},
  buyv(){const r=buyVoucher();if(!r.ok){toast(r.msg||'Cannot buy');return}sfx.coin();renderShop();refreshAll()},
  reroll(){const r=rerollShop();if(!r.ok){toast(r.msg);return}sfx.click();renderShop();refreshAll()},
  pack(id){
    const p=G.shop.packs.find(x=>x.uid===+id);if(!p||G.money<p.cost)return;
    G.money-=p.cost;G.shop.packs=G.shop.packs.filter(x=>x!==p);sfx.coin();renderSide();packOverlay(p);
  },
  take(id){
    const {ch}=window.__pack;const r=takeChoice(ch[+id]);
    if(!r.ok){toast(r.msg);return}
    closeOverlay();if(r.msg)toast(r.msg);window.__pack=null;
    sfx.coin();renderShop();refreshAll();
  },
  skippack(){closeOverlay();window.__pack=null;renderShop();refreshAll()},
  next(){setPhase('blinds')},
  cashout(id){cashOut(id)},
  goshop(){closeOverlay();const n=enterShop();busy=false;setPhase('shop');if(n.length)toast(n.join(' · '))}
};
function moveJ(d){
  const i=G.jokers.findIndex(x=>x.uid===selJ),k=i+d;
  if(i<0||k<0||k>=G.jokers.length)return;
  [G.jokers[i],G.jokers[k]]=[G.jokers[k],G.jokers[i]];renderJokers();renderDetail();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const f=ACT[b.dataset.act];if(f)f(b.dataset.id,b);
});
window.addEventListener('resize',fit);
window.addEventListener('keydown',e=>{
  if(!G||G.phase!=='play'||$('#overlay').classList.contains('on'))return;
  if(e.key==='Enter')doPlay();else if(e.key==='d'||e.key==='D')doDiscard();
});

/* ---- menu ---- */
function renderMenu(){
  $('#decks').innerHTML=Object.entries(DECKS).map(([k,d])=>`<div class="deckpick ${deckPick===k?'on':''}" data-act="deck" data-id="${k}"><b>${d.n}</b>${d.d}</div>`).join('');
  $('#menustats').textContent=`Runs ${MS.runs} · Wins ${MS.wins} · Best ante ${MS.bestAnte} · Best hand ${fmt(MS.bestHand)}`;
  const fan=$('#fan');
  if(!fan.children.length){
    [['A','S'],['K','H'],['Q','C'],['J','D'],['10','S']].forEach(([r,s],i)=>{
      const rk={A:14,K:13,Q:12,J:11,'10':10}[r];const c=mk(rk,s);G=null;
      const e=cardEl(c);e.dataset.act='';e.style.setProperty('--cw','clamp(54px,16vw,92px)');
      e.style.transform=`translateX(-50%) rotate(${(i-2)*13}deg) translateY(${Math.abs(i-2)*6}px)`;e.style.marginLeft=`${(i-2)*0}px`;
      e.style.left=`calc(50% + ${(i-2)*clampPx(16,54,92)*.55}px)`;fan.appendChild(e);
    });
  }
}
function clampPx(vw,min,max){return Math.max(min,Math.min(max,innerWidth*vw/100))}
renderMenu();
})();
</script>
