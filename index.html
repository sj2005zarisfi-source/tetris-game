<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>تتریس</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game" dir="ltr">
  <aside class="side">
    <div class="panel"><h3>Hold</h3><canvas id="hold" width="96" height="96"></canvas></div>
    <div class="panel"><h3>امتیاز</h3><div id="score" class="val">0</div></div>
    <div class="panel"><h3>سطح</h3><div id="level" class="val">1</div></div>
    <div class="panel"><h3>خط‌ها</h3><div id="lines" class="val">0</div></div>
    <div class="panel"><h3>رکورد</h3><div id="best" class="val">0</div></div>
  </aside>

  <div class="board-wrap">
    <canvas id="board" width="300" height="600"></canvas>
    <div id="overlay" class="overlay">
      <h1 id="ovTitle">تتریس</h1>
      <p id="ovText">برای شروع Enter یا دکمه زیر را بزنید</p>
      <button id="startBtn">شروع بازی</button>
    </div>
  </div>

  <aside class="side">
    <div class="panel"><h3>بعدی</h3><canvas id="next" width="96" height="260"></canvas></div>
    <div class="panel help">
      <b>کلیدها</b><br>
      ← → حرکت<br>
      ↑ / X چرخش<br>
      Z چرخش معکوس<br>
      ↓ سقوط نرم<br>
      Space سقوط سریع<br>
      C / Shift نگه‌داشتن<br>
      P / Esc توقف
    </div>
  </aside>
</main>

<div class="touch" dir="ltr">
  <button data-a="left">◀</button>
  <button data-a="rotate">⟳</button>
  <button data-a="right">▶</button>
  <button data-a="down">▼</button>
  <button data-a="drop">⤓</button>
  <button data-a="hold">H</button>
  <button data-a="pause">⏸</button>
</div>
<script src="game.js"></script>
</body>
</html>
